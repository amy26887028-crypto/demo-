.fb{text-align:left;padding:12px;border-radius:12px;margin:8px 0;font-size:15px;border:1px solid var(--line)}.fb.g b{color:var(--ok)}.fb.r b{color:var(--bad)}
</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800;900&display=swap"></head><body><div id="app"></div>
<script>
const IN={
piano:{n:'鋼琴',e:'🎹',h:'聲音清脆，一敲下去就慢慢變小聲。'},
violin:{n:'小提琴',e:'🎻',h:'聲音綿長像在唱歌，還帶一點顫音。'},
flute:{n:'直笛',e:'🪈',h:'聲音圓潤清亮、很單純，像小鳥唱歌，帶一點氣息聲。'},
drum:{n:'鼓',e:'🥁',h:'沒有固定音高，是「咚咚、嚓」的敲擊節奏。'}};
const K=Object.keys(IN),A=document.getElementById('app'),S={};
const rnd=a=>a[Math.random()*a.length|0];
let ac,nbuf;
function ctx(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}
function noise(c){if(!nbuf){nbuf=c.createBuffer(1,c.sampleRate,c.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}return nbuf}
function osc(c,o,type,f,t,d,pk,a){const s=c.createOscillator(),g=c.createGain();s.type=type;s.frequency.value=f;
g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(pk,t+a);g.gain.setValueAtTime(pk,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d);
s.connect(g).connect(o);s.start(t);s.stop(t+d+.05);return s}
function hit(c,o,t,kind){const g=c.createGain();
if(kind){const s=c.createOscillator();s.frequency.setValueAtTime(150,t);s.frequency.exponentialRampToValueAtTime(45,t+.15);
g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.0001,t+.3);s.connect(g).connect(o);s.start(t);s.stop(t+.35)}
else{const n=c.createBufferSource(),h=c.createBiquadFilter();n.buffer=noise(c);h.type='highpass';h.frequency.value=1500;
g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.0001,t+.18);n.connect(h).connect(g).connect(o);n.start(t);n.stop(t+.2)}}
const SC=[261.6,293.7,329.6,392,440,523.3];
function phrase(k,c,o,t){
if(k==='drum'){[1,0,1,1,0,1].forEach((x,i)=>hit(c,o,t+i*.4,x));return}
const n=k==='piano'?4:3,per=2.4/n;
for(let i=0;i<n;i++){const f=rnd(SC)*(k==='flute'?2:1),s=t+i*per;
if(k==='piano'){[1,2,3].forEach((m,j)=>osc(c,o,'sine',f*m,s,1.2,.3/(j+1),.01))}
else if(k==='violin'){const v=osc(c,o,'sawtooth',f,s,per,.12,.2),l=c.createOscillator(),lg=c.createGain();
l.frequency.value=5.5;lg.gain.value=f*.012;l.connect(lg).connect(v.frequency);l.start(s);l.stop(s+per+.05)}
else{osc(c,o,'sine',f,s,per,.3,.1);const nz=c.createBufferSource(),b=c.createBiquadFilter(),g=c.createGain();
nz.buffer=noise(c);b.type='bandpass';b.frequency.value=f*2;g.gain.setValueAtTime(.025,s);g.gain.linearRampToValueAtTime(.0001,s+per);
nz.connect(b).connect(g).connect(o);nz.start(s);nz.stop(s+per+.05)}}}
function listen(){const c=ctx(),o=c.createGain();o.gain.value=S.q.length>1?.55:.85;o.connect(c.destination);
const t=c.currentTime+.05;S.q.forEach(k=>phrase(k,c,o,t))}
function mk(){if(S.mode==1){let k;do{k=rnd(K)}while(S.q&&S.q[0]==k);return[k]}return[...K].sort(()=>Math.random()-.5).slice(0,2)}
function home(){A.innerHTML=`<div class="card c"><div class="big">🕵️</div><h1>音色偵探社</h1><p class="sub">誰在發出聲音？</p>
<p>仔細聽線索，從樂器圖案中找出聲音的主人！</p>
<button class="btn" onclick="start(1)">初級偵查<small>單一樂器・6 題</small></button>
<button class="btn alt" onclick="start(2)">高級偵查<small>兩種樂器同時演奏・5 題</small></button>
<p class="mute">🎧 建議戴上耳機或調高音量</p></div>`}
function start(m){Object.assign(S,{mode:m,i:0,score:0,streak:0,q:null,N:m==1?6:5});next()}
function next(){if(S.i>=S.N)return end();S.i++;S.q=mk();S.sel=[];S.hint=false;S.done=false;draw();setTimeout(listen,350)}
function draw(){const m2=S.mode==2;
A.innerHTML=`<div class="bar"><span>第 ${S.i}／${S.N} 題</span><span>⭐ ${S.score}</span><span>🔥 ${S.streak}</span></div>
<div class="card c"><p class="q">${m2?'有<b>兩種</b>樂器同時演奏，請選出兩個！':'這是哪一種樂器的聲音？'}</p>
<button class="play" onclick="listen()">🔊 播放線索</button>
<div class="grid">${K.map(k=>`<button class="ins" id="i_${k}" onclick="pick('${k}')"><span>${IN[k].e}</span>${IN[k].n}</button>`).join('')}</div>
<div id="fb"></div><div id="ctl">${m2?'<button class="btn" id="sub" disabled onclick="check()">送出答案</button>':''}
<button class="ghost" onclick="hint()">💡 偵探提示（少 ${m2?5:4} 分）</button></div></div>`}
function pick(k){if(S.done)return;
if(S.mode==1){S.sel=[k];return check()}
const i=S.sel.indexOf(k);if(i>=0)S.sel.splice(i,1);else if(S.sel.length<2)S.sel.push(k);
K.forEach(x=>document.getElementById('i_'+x).classList.toggle('sel',S.sel.includes(x)));
document.getElementById('sub').disabled=S.sel.length<2}
function hint(){if(S.done||S.hint)return;S.hint=true;
document.getElementById('fb').innerHTML=`<div class="fb"><b>💡 線索</b><br>${S.q.map((k,i)=>IN[k].h).join('<br>')}</div>`}
function check(){S.done=true;const q=S.q,s=S.sel,hits=s.filter(k=>q.includes(k)).length,full=hits==q.length&&s.length==q.length;
let p=0;if(full)p=(S.mode==1?10:15)-(S.hint?(S.mode==1?4:5):0);else if(S.mode==2&&hits==1)p=3;
S.score+=p;S.streak=full?S.streak+1:0;
K.forEach(k=>{const e=document.getElementById('i_'+k);e.classList.remove('sel');if(q.includes(k))e.classList.add('ok');else if(s.includes(k))e.classList.add('bad')});
document.getElementById('ctl').style.display='none';
document.getElementById('fb').innerHTML=`<div class="fb ${full?'g':'r'}"><b>${full?'答對了！+'+p+' 分':(p?'答對一半，+'+p+' 分':'再接再厲！')}</b><br>${q.map(k=>IN[k].e+' '+IN[k].n+'：'+IN[k].h).join('<br>')}</div>
<button class="btn" onclick="next()">${S.i>=S.N?'看結果':'下一題'}</button>`}
function end(){const mx=S.N*(S.mode==1?10:15),r=S.score/mx,
t=r>=.9?['🏆','神探級偵探']:r>=.6?['🔎','資深偵探']:['🐾','見習偵探'];
if(r>=.6)parent.postMessage({lvl:4,stars:r>=.9?3:r>=.8?2:1},"*");
A.innerHTML=`<div class="card c"><div class="big">${t[0]}</div><h1>${t[1]}</h1><p class="sub">${S.score}／${mx} 分</p>
<p>${r>=.9?'你的耳朵太厲害了！':'多聽幾次，你會越來越會分辨音色。'}</p>
<button class="btn" onclick="start(${S.mode})">再玩一次</button><button class="btn alt" onclick="home()">回到首頁</button></div>`}
home();
<\/script></body></html>
</script>
<script type="text/plain" id="lv5"><!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>音樂快慢列車</title>
<style>
:root{--bg:#fdf8ee;--card:#fff;--ink:#2b2438;--mute:#6d6580;--acc:#7c4dff;--ok:#1f9d6b;--bad:#d64550;--line:#e6dfd0;--sky:#cfeaff;--ground:#8bc48a;--tie:#6b4f3a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#181424;--card:#241e36;--ink:#f1ecff;--mute:#a79fc0;--acc:#a78bfa;--ok:#4cd9a0;--bad:#ff7a85;--line:#3a3252;--sky:#2a3f66;--ground:#2c5a45;--tie:#c9b79c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#181424;--card:#241e36;--ink:#f1ecff;--mute:#a79fc0;--acc:#a78bfa;--ok:#4cd9a0;--bad:#ff7a85;--line:#3a3252;--sky:#2a3f66;--ground:#2c5a45;--tie:#c9b79c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
.c{text-align:center}.big{font-size:56px}h1{margin:.2em 0 0;font-size:28px}.sub{font-size:20px;color:var(--acc);margin:0 0 12px;font-weight:700}.mute{color:var(--mute);font-size:14px}
.bar{display:flex;justify-content:space-between;margin-bottom:12px;font-weight:700}
.btn{display:block;width:100%;margin:10px 0;padding:14px;border:0;border-radius:14px;background:var(--acc);color:#fff;font:inherit;font-weight:700;font-size:18px;cursor:pointer}
.btn.alt{background:#ff8a3d}.btn small{display:block;font-weight:400;font-size:13px;opacity:.9}
button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 14px;cursor:pointer}
.btn,.btn.alt{color:#fff}
.q{font-size:18px;margin:12px 0}
.play{padding:10px 22px;border:2px solid var(--acc);border-radius:999px;background:none;color:var(--acc);font-weight:700;font-size:17px}
.track{position:relative;height:110px;overflow:hidden;border-radius:14px;background:linear-gradient(var(--sky) 0 72%,var(--ground) 72%)}
.train{position:absolute;left:50%;bottom:28px;font-size:56px;line-height:1;transform:translateX(-50%);animation:bn ease-in-out infinite;animation-play-state:paused}
.rail{position:absolute;left:0;right:0;bottom:14px;height:8px;background:repeating-linear-gradient(90deg,var(--tie) 0 10px,transparent 10px 60px);animation:mv linear infinite;animation-play-state:paused}
@keyframes mv{to{background-position:-60px 0}}@keyframes bn{50%{transform:translateX(-50%) translateY(-9px)}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.ins{padding:12px 6px;border:2px solid var(--line);border-radius:16px;font-size:16px;font-weight:700}
.ins span{display:block;font-size:42px;line-height:1.2}
.ins.ok{border-color:var(--ok)}.ins.bad{border-color:var(--bad)}
.sl{display:flex;align-items:center;gap:8px;margin-top:8px}.sl input{flex:1}.bpm{font-size:20px;margin:4px 0}
.fb{text-align:left;padding:12px;border-radius:12px;margin:10px 0;font-size:15px;border:1px solid var(--line)}.fb.g b{color:var(--ok)}.fb.r b{color:var(--bad)}
</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800;900&display=swap"></head><body><div id="app"></div>
<script>
const T=[{n:'慢車',e:'🚂',t:'慢板 Adagio',lo:56,hi:72},{n:'普通車',e:'🚃',t:'行板 Andante',lo:80,hi:100},{n:'快車',e:'🚄',t:'快板 Allegro',lo:116,hi:136},{n:'特快車',e:'🚅',t:'急板 Presto',lo:156,hi:184}];
const A=document.getElementById('app'),$=id=>document.getElementById(id),ri=(a,b)=>(a+Math.random()*(b-a))|0;
const F=[261.6,293.7,329.6,392,440,523.3],tierOf=b=>b<76?0:b<108?1:b<146?2:3;
let ac,O,timer,nb,R={},S={};
function ctx(){if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();O=ac.createGain();O.gain.value=.8;O.connect(ac.destination)}if(ac.state==='suspended')ac.resume();return ac}
function noise(c){if(!nb){nb=c.createBuffer(1,c.sampleRate,c.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}return nb}
function o1(c,f,t,d,pk,a){const s=c.createOscillator(),g=c.createGain();s.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(pk,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(g).connect(O);s.start(t);s.stop(t+d+.05)}
function kick(c,t){const s=c.createOscillator(),g=c.createGain();s.frequency.setValueAtTime(150,t);s.frequency.exponentialRampToValueAtTime(45,t+.15);g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.0001,t+.3);s.connect(g).connect(O);s.start(t);s.stop(t+.35)}
function burst(c,t,type,fr,d,pk){const n=c.createBufferSource(),h=c.createBiquadFilter(),g=c.createGain();n.buffer=noise(c);h.type=type;h.frequency.value=fr;g.gain.setValueAtTime(pk,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);n.connect(h).connect(g).connect(O);n.start(t);n.stop(t+d+.02)}
function beat(c,t,i){if(i%2==0)kick(c,t);burst(c,t,'highpass',6000,.05,.2);const f=F[R.mel[i%8]];o1(c,f,t,.5,.25,.01);o1(c,f*2,t,.3,.08,.01)}
function sched(){const c=ac,n=c.currentTime;
while(R.music&&R.nm<n+.15){beat(c,R.nm,R.mi);R.nm+=60/R.bpm;R.mi++;if(!R.loop&&R.mi>=8)R.music=false}
while(R.train&&R.nt<n+.15){burst(c,R.nt,'bandpass',700,.09,.7);R.nt+=60/S.bpm}
if(!R.music&&!R.train)stopAudio()}
function stopAudio(){clearInterval(timer);R={}}
function play(bpm,loop,train){const c=ctx();stopAudio();const t=c.currentTime+.1;
R={music:1,loop,bpm,nm:t,mi:0,mel:Array.from({length:8},()=>ri(0,6)),train,nt:t};timer=setInterval(sched,40);sched()}
function vis(b,e,on){const t=$('tr'),r=$('rl');t.textContent=e;[t,r].forEach(x=>{x.style.animationDuration=60/b+'s';x.style.animationPlayState=on?'running':'paused'})}
function home(){stopAudio();A.innerHTML=`<div class="card c"><div class="big">🚂</div><h1>音樂快慢列車</h1><p class="sub">跟著節拍出發！</p>
<p>音樂越快，列車就要開越快。聽出音樂的速度，讓列車準時進站！<br>5 題累積 30 分就能過關。</p>
<button class="btn" onclick="start(1)">選列車<small>聽音樂，選出正確的列車・5 題</small></button>
<button class="btn alt" onclick="start(2)">調速度挑戰<small>拉滑桿，讓列車節拍對上音樂・5 題</small></button>
<p class="mute">🎧 建議戴上耳機或調高音量</p></div>`}
function start(m){S={mode:m,i:0,N:5,score:0,streak:0,bpm:100,tr:true};next()}
function next(){if(S.i>=S.N)return end();S.i++;S.done=false;
if(S.mode==1){let k;do{k=ri(0,4)}while(k===S.k);S.k=k;S.target=ri(T[k].lo,T[k].hi+1)}
else{S.target=ri(60,171);S.bpm=100;S.tol=[10,8,7,6,5][S.i-1]}
draw()}
function draw(){const m1=S.mode==1;
A.innerHTML=`<div class="bar"><span>第 ${S.i}／${S.N} 題</span><span>⭐ ${S.score}</span><span>🔥 ${S.streak}</span></div><div class="card c">
<div class="track"><div class="train" id="tr">🚉</div><div class="rail" id="rl"></div></div>
<p class="q">${m1?'聽聽看，這首音樂要搭哪一種列車？':`調整列車速度，讓列車節拍跟上音樂！<br><small class="mute">容許誤差 ±${S.tol} BPM</small>`}</p>
<button class="play" onclick="replay()">🔊 ${m1?'再聽一次':'重播音樂'}</button>
${m1?`<div class="grid">${T.map((x,i)=>`<button class="ins" id="t${i}" onclick="pick(${i})"><span>${x.e}</span>${x.n}</button>`).join('')}</div>`
:`<div class="sl"><span>🐢 慢</span><input type="range" id="sp" min="50" max="190" value="${S.bpm}"><span>快 🐇</span></div><p class="bpm"><b id="bv">${S.bpm}</b> BPM</p>
<div class="row"><button id="tg" onclick="tgl()">🚂 列車節拍：開</button> <button onclick="chk()"><b>✅ 對上了！</b></button></div>`}
<div id="fb"></div></div>`;
if(!m1){$('sp').oninput=e=>{S.bpm=+e.target.value;$('bv').textContent=S.bpm;vis(S.bpm,T[tierOf(S.bpm)].e,true)};vis(S.bpm,T[tierOf(S.bpm)].e,true)}
play(S.target,!m1,!m1&&S.tr)}
function replay(){play(S.target,S.mode==2&&!S.done,S.mode==2&&!S.done&&S.tr)}
function tgl(){if(S.done)return;S.tr=!S.tr;$('tg').textContent='🚂 列車節拍：'+(S.tr?'開':'關');if(R.music){R.train=S.tr;R.nt=R.nm}}
function nextBtn(){return `<button class="btn" onclick="next()">${S.i>=S.N?'看結果':'下一題'}</button>`}
function pick(i){if(S.done)return;S.done=true;const ok=i==S.k;if(ok){S.score+=10;S.streak++}else S.streak=0;
$('t'+S.k).classList.add('ok');if(!ok)$('t'+i).classList.add('bad');vis(S.target,T[S.k].e,true);
$('fb').innerHTML=`<div class="fb ${ok?'g':'r'}"><b>${ok?'答對了！+10 分':'差一點！'}</b><br>這首音樂是 ${S.target} BPM，屬於${T[S.k].t}，要搭${T[S.k].e} ${T[S.k].n}。</div>`+nextBtn()}
function chk(){if(S.done)return;S.done=true;stopAudio();const d=Math.abs(S.bpm-S.target),p=d<=S.tol?10:d<=S.tol*2?5:0;
S.score+=p;S.streak=p==10?S.streak+1:0;$('sp').disabled=true;vis(S.target,T[tierOf(S.target)].e,true);
const h=p==10?'':S.bpm<S.target?'你的列車開得太慢了。':'你的列車開得太快了。';
$('fb').innerHTML=`<div class="fb ${p==10?'g':'r'}"><b>${p==10?'完美對上！+10 分':p?'很接近了！+5 分':'還差一點，再聽聽節拍。'}</b><br>音樂是 ${S.target} BPM，你調的是 ${S.bpm} BPM（相差 ${d}）。${h}<br>列車現在以正確速度前進。</div>`+nextBtn()}
function end(){stopAudio();const mx=S.N*10,ok=S.score>=30,r=S.score/mx,t=r>=.9?['🏆','特級列車長']:r>=.6?['🚉','資深列車長']:['🎫','見習列車長'];
if(ok)parent.postMessage({lvl:5,stars:r>=.9?3:r>=.8?2:1},"*");
A.innerHTML=`<div class="card c"><div class="big">${ok?'🎉':'🚧'}</div><h1>${ok?'過關成功！':'再挑戰一次'}</h1><p class="sub">${S.score}／${mx} 分</p>
<p>${ok?`🏅 ${t[1]}・你已達到過關門檻（30 分），${r>=.9?'節拍感太棒了，':''}列車準時抵達！`:`過關需要 30 分，還差 ${30-S.score} 分。多聽幾次音樂的節拍，下次一定可以！`}</p>
<button class="btn" onclick="start(${S.mode})">${ok?'再玩一次':'再挑戰一次'}</button><button class="btn alt" onclick="home()">回到首頁</button></div>`}
home();
<\/script></body></html>
</script>
<script type="text/plain" id="lv6"><!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI音樂創作大師</title>
<style>
:root{--bg:#fdf8ee;--card:#fff;--ink:#2b2438;--mute:#6d6580;--acc:#7c4dff;--ok:#1f9d6b;--line:#e6dfd0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#181424;--card:#241e36;--ink:#f1ecff;--mute:#a79fc0;--acc:#a78bfa;--ok:#4cd9a0;--line:#3a3252;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#181424;--card:#241e36;--ink:#f1ecff;--mute:#a79fc0;--acc:#a78bfa;--ok:#4cd9a0;--line:#3a3252;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
#app{max-width:640px;margin:0 auto;padding:16px}
h1{margin:0;font-size:26px}h3{margin:0 0 8px;font-size:17px}.mute{color:var(--mute);font-size:14px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;align-items:center}
select,button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer}
button.main{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
.pal,.pit{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.pb{min-width:74px;text-align:center;cursor:grab}.pb b{display:block;font-size:28px;line-height:1.1}.pb small{font-size:12px}
.on{border-color:var(--acc)!important;background:color-mix(in srgb,var(--acc) 18%,var(--card))!important}
.pt{padding:6px 10px}
.bar{border:2px solid var(--line);border-radius:12px;padding:6px 10px;margin-bottom:8px;min-height:56px}
.bar.full{border-color:var(--ok)}.bar.now{outline:3px solid var(--acc)}
.bh{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.ns{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.ns em{color:var(--mute);font-size:14px}
.chip{display:inline-block;text-align:center;border:1px solid var(--line);border-radius:8px;padding:0 8px;font-size:24px;line-height:1.2;background:var(--bg);cursor:pointer}
.chip small{display:block;font-size:11px;color:var(--mute)}
#msg{color:#d64550;min-height:1.4em;font-size:14px}ul{margin:4px 0;padding-left:20px}
#win{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:9}
#win.on{display:flex}#win .box{background:var(--card);border-radius:24px;padding:24px;max-width:420px;width:100%;text-align:center}
.box .big{font-size:64px;animation:bn 1s infinite alternate}@keyframes bn{to{transform:translateY(-10px) scale(1.1)}}
.box h2{margin:4px 0}.stars{font-size:36px;color:#f5b301;letter-spacing:6px}
</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800;900&display=swap"></head><body><div id="app">
<h1>🎼 AI 音樂創作大師</h1>
<p class="mute">電腦：拖曳音符到小節裡；手機：先點選音符，再點小節放入。點小節裡的音符可以刪除。完成 2 小節並按播放聽完，就能過關！</p>
<div class="card"><h3>① 設定</h3>
<div class="row"><label>拍號 <select id="ts"><option value="4">4/4</option><option value="3">3/4</option><option value="2">2/4</option></select></label>
<label>樂器 <select id="inst"><option value="piano">🎹 鋼琴</option><option value="violin">🎻 小提琴</option><option value="recorder">🪈 直笛</option><option value="drum">🥁 鼓</option></select></label>
<label>力度 <select id="dyn"><option value="0">保持不變</option><option value="1">漸強</option><option value="2">漸弱</option><option value="3">先漸強再漸弱</option></select></label></div>
<label>速度 <input type="range" id="bpm" min="60" max="180" value="100"> <b id="bv">100</b> BPM</label></div>
<div class="card"><h3>② 選音符與音高</h3><div class="pal" id="pal"></div><div class="pit" id="pit"></div></div>
<div class="card"><h3>③ 我的 2 小節</h3><div id="bars"></div><div id="msg"></div>
<div class="row"><button class="main" id="play">▶ 播放我的作品</button><button id="stop">■ 停止</button><button id="clr">🗑 清除</button></div></div>
<div class="card"><h3>🤖 AI 助手</h3>
<div class="row"><button id="aiA">✨ 幫我編曲</button><button id="aiT">💡 創作建議</button><button id="snap">📌 存成修改前</button><button id="cmp">⚖️ 比較前後</button></div><div id="ai"></div></div>
</div>
<script>
const P=[{s:'𝅝',n:'全音符',d:4},{s:'𝅗𝅥',n:'二分音符',d:2},{s:'♩',n:'四分音符',d:1},{s:'♪',n:'八分音符',d:.5},{s:'♬',n:'十六分音符',d:.25},{s:'𝄻',n:'全休止符',d:4,r:1},{s:'𝄽',n:'四分休止符',d:1,r:1}];
const NM=['Do','Re','Mi','Fa','Sol','La','Si','Do’','Re’','Mi’'],FR=[261.6,293.7,329.6,349.2,392,440,493.9,523.3,587.3,659.3];
const $=id=>document.getElementById(id),rnd=a=>a[Math.random()*a.length|0];
const S={bars:Array.from({length:2},()=>[]),ts:4,bpm:100,inst:'piano',dyn:0,sel:2,pitch:0};
let snap=null,ac,M=null,timers=[],nbuf;
const used=b=>b.reduce((a,n)=>a+n.d,0),sym=n=>(P.find(x=>x.d==n.d&&!!x.r==!!n.r)||P[2]).s;
const cp=()=>JSON.parse(JSON.stringify({bars:S.bars,ts:S.ts,bpm:S.bpm,inst:S.inst,dyn:S.dyn}));
function render(){
$('pal').innerHTML=P.map((x,i)=>`<button class="pb${i==S.sel?' on':''}" draggable="true" data-p="${i}"><b>${x.s}</b><small>${x.n}</small></button>`).join('');
$('pit').innerHTML=NM.map((x,i)=>`<button class="pt${i==S.pitch?' on':''}" data-t="${i}">${x}</button>`).join('');
$('bars').innerHTML=S.bars.map((b,i)=>{const u=used(b);return `<div class="bar${u>=S.ts-1e-9?' full':''}" data-i="${i}"><div class="bh"><span>第 ${i+1} 小節</span><span>${u} / ${S.ts} 拍</span></div><div class="ns">${b.map((n,j)=>`<span class="chip" data-b="${i}" data-j="${j}">${sym(n)}<small>${n.r?'休':NM[n.p]}</small></span>`).join('')||'<em>放入音符</em>'}</div></div>`}).join('')}
const msg=t=>$('msg').textContent=t;
function ctx(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}
function out(){const c=ctx(),o=c.createGain();o.connect(c.destination);return[c,o]}
function noise(c){if(!nbuf){nbuf=c.createBuffer(1,c.sampleRate,c.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}return nbuf}
function osc(c,o,type,f,t,d,pk,a){const s=c.createOscillator(),g=c.createGain();s.type=type;s.frequency.value=f;
g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(pk,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d);
s.connect(g).connect(o);s.start(t);s.stop(t+d+.05);return s}
function hit(c,o,t,kick){const g=c.createGain();
if(kick){const s=c.createOscillator();s.frequency.setValueAtTime(150,t);s.frequency.exponentialRampToValueAtTime(45,t+.15);g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.0001,t+.3);s.connect(g).connect(o);s.start(t);s.stop(t+.35)}
else{const n=c.createBufferSource(),h=c.createBiquadFilter();n.buffer=noise(c);h.type='highpass';h.frequency.value=1500;g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.0001,t+.18);n.connect(h).connect(g).connect(o);n.start(t);n.stop(t+.2)}}
function tone(c,o,I,t,n,d,v){if(n.r)return;const m=c.createGain();m.gain.value=v;m.connect(o);const f=FR[n.p];
if(I==='drum')return hit(c,m,t,n.p<4);
if(I==='piano'){const L=Math.min(d+.3,1.6);[1,2,3].forEach((k,j)=>osc(c,m,'sine',f*k,t,L,.3/(j+1),.01))}
else if(I==='violin'){const s=osc(c,m,'sawtooth',f,t,d,.12,Math.min(.15,d/3)),l=c.createOscillator(),g=c.createGain();l.frequency.value=5.5;g.gain.value=f*.012;l.connect(g).connect(s.frequency);l.start(t);l.stop(t+d+.05)}
else{osc(c,m,'sine',f*2,t,d,.3,.04);osc(c,m,'sine',f*4,t,d,.04,.04)}}
const pre=n=>{const[c,o]=out();tone(c,o,S.inst,c.currentTime+.02,n,.5,.7)};
const hl=i=>document.querySelectorAll('.bar').forEach((e,j)=>e.classList.toggle('now',j==i));
function stop(){timers.forEach(clearTimeout);timers=[];if(M){try{M.disconnect()}catch(e){}M=null}hl(-1)}
function playSong(st,done){stop();const[c,o]=out();M=o;const bt=60/st.bpm;let t=c.currentTime+.15;
st.bars.forEach((b,i)=>{timers.push(setTimeout(()=>hl(i),(t-c.currentTime)*1000));let x=0;
b.forEach(n=>{const pr=(i+x/st.ts)/2,v=[.65,.3+.7*pr,1-.7*pr,.3+.7*Math.sin(pr*Math.PI)][st.dyn];tone(c,o,st.inst,t,n,n.d*bt*.95,v*.9);t+=n.d*bt;x+=n.d});t+=(st.ts-x)*bt});
timers.push(setTimeout(()=>{hl(-1);done&&done()},(t-c.currentTime)*1000+100))}
function add(i,pi){const x=P[pi],b=S.bars[i],left=S.ts-used(b);
if(x.d>left+1e-9){msg(`第 ${i+1} 小節只剩 ${left} 拍，放不下${x.n}（${x.d} 拍）`);return}
const n={d:x.d,r:x.r?1:0,p:x.r?-1:S.pitch};b.push(n);msg('');render();pre(n)}
$('pal').onclick=e=>{const b=e.target.closest('.pb');if(b){S.sel=+b.dataset.p;render()}};
$('pal').ondragstart=e=>{const b=e.target.closest('.pb');if(b){S.drag=+b.dataset.p;e.dataTransfer.setData('text/plain',b.dataset.p)}};
$('pit').onclick=e=>{const b=e.target.closest('.pt');if(b){S.pitch=+b.dataset.t;render();pre({r:0,p:S.pitch})}};
$('bars').ondragover=e=>e.preventDefault();
$('bars').ondrop=e=>{e.preventDefault();const b=e.target.closest('.bar');if(b&&S.drag!=null)add(+b.dataset.i,S.drag)};
$('bars').onclick=e=>{const c=e.target.closest('.chip');if(c){S.bars[+c.dataset.b].splice(+c.dataset.j,1);msg('');render();return}const b=e.target.closest('.bar');if(b)add(+b.dataset.i,S.sel)};
$('ts').onchange=e=>{S.ts=+e.target.value;S.bars=S.bars.map(b=>{let u=0;return b.filter(n=>(u+=n.d)<=S.ts+1e-9)});render()};
$('bpm').oninput=e=>{S.bpm=+e.target.value;$('bv').textContent=S.bpm};
$('inst').onchange=e=>S.inst=e.target.value;$('dyn').onchange=e=>S.dyn=+e.target.value;
const full=()=>S.bars.every(b=>used(b)>=S.ts-1e-9);
function levelClear(){const vr=new Set(S.bars.flat().map(n=>n.d)).size>1,dy=S.dyn!=0,st=1+vr+dy;
const line=S.bars.map(b=>b.map(n=>sym(n)+(n.r?'':NM[n.p])).join(' ')).join('  ｜  ');
const need=[!vr&&'混合不同長短的音符',!dy&&'加上漸強或漸弱'].filter(Boolean).join('、');
if(!$('win'))document.body.insertAdjacentHTML('beforeend','<div id="win"><div class="box" id="wb"></div></div>');
$('wb').innerHTML=`<div class="big">🎉</div><h2>過關成功！</h2><div class="stars">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div><p>你完成了 2 小節的創作，也聽完了自己的作品！</p><p class="mute">${line}</p><p class="mute">${st==3?'節奏有變化，還用了力度，太可害了！':'再試試'+need+'，就能拿到更多星星。'}</p><div class="row" style="justify-content:center"><button class="main" id="w1">再聽一次</button><button id="w2">繼續修改</button><button id="w3">重新創作</button></div>`;
$('win').classList.add('on');parent.postMessage({lvl:6,stars:st},"*");
$('w1').onclick=()=>playSong(S);$('w2').onclick=()=>{stop();$('win').classList.remove('on')};$('w3').onclick=()=>{$('clr').onclick();$('win').classList.remove('on')}}
$('play').onclick=()=>{const ok=full();msg(ok?'':'兩個小節都要放滿，聽完才能過關喔！');playSong(S,()=>{if(ok&&full())levelClear()})};$('stop').onclick=stop;
$('clr').onclick=()=>{stop();S.bars=Array.from({length:2},()=>[]);msg('');render()};
$('aiA').onclick=()=>{snap=cp();let p=S.bars.flat().filter(n=>!n.r).pop()?.p??0;
S.bars.forEach(b=>{let left=S.ts-used(b);while(left>1e-9){const d=rnd([2,1,1,.5,.5,.25].filter(d=>d<=left+1e-9));p=Math.max(0,Math.min(9,p+rnd([-2,-1,-1,0,1,1,2])));b.push({d,r:0,p});left-=d}});
const l=S.bars[1].filter(n=>!n.r).pop();if(l)l.p=0;render();
$('ai').innerHTML='<p>✨ 我幫你補完了空白的拍子，並讓結尾回到 Do。已自動存下「修改前」的版本，按「比較前後」聽聽差別，再自己微調吧！</p>'};
$('aiT').onclick=()=>{const all=S.bars.flat(),notes=all.filter(n=>!n.r),tips=[];
if(!all.length)tips.push('先從第 1 小節放幾個音符開始吧！');
else{const inc=S.bars.map((b,i)=>[i+1,S.ts-used(b)]).filter(x=>x[1]>1e-9);
if(inc.length)tips.push(`第 ${inc.map(x=>x[0]).join('、')} 小節還沒放滿，可以補上音符或休止符。`);
if(!all.some(n=>n.r))tips.push('試著加入休止符，讓音樂有呼吸的空間。');
if(new Set(all.map(n=>n.d)).size<2)tips.push('目前節奏都一樣，混合長短不同的音符會更有變化。');
const ps=notes.map(n=>n.p);if(ps.length&&Math.max(...ps)-Math.min(...ps)<3)tips.push('音域比較窄，試著加入更高或更低的音。');
const l=notes[notes.length-1];if(l&&l.p!=0&&l.p!=7)tips.push('結尾落在 Do 會有回到家的結束感。');
if(S.dyn==0)tips.push('試試「漸強」或「漸弱」，讓情緒有起伏。')}
if(!tips.length)tips.push('太棒了！你的作品很完整，可以按「幫我編曲」看看 AI 的版本，再比較一下。');
$('ai').innerHTML='<p><b>💡 創作建議</b></p><ul>'+tips.slice(0,4).map(t=>`<li>${t}</li>`).join('')+'</ul>'};
$('snap').onclick=()=>{snap=cp();$('ai').innerHTML='<p>📌 已存下目前的作品當作「修改前」。繼續修改後，按「比較前後」。</p>'};
$('cmp').onclick=()=>{if(!snap){$('ai').innerHTML='<p>請先按「存成修改前」，或使用「幫我編曲」會自動存檔。</p>';return}
const B=cp(),d=[];for(let i=0;i<2;i++)if(JSON.stringify(snap.bars[i])!=JSON.stringify(B.bars[i]))d.push(i+1);
const st=s=>{const a=s.bars.flat(),n=a.filter(x=>!x.r);return `${n.length} 個音、${a.length-n.length} 個休止符`};
const nm={piano:'鋼琴',violin:'小提琴',recorder:'直笛',drum:'鼓'},dn=['不變','漸強','漸弱','先漸強再漸弱'];
$('ai').innerHTML=`<p><b>⚖️ 修改前 vs 修改後</b></p><ul><li>不同的小節：${d.length?d.join('、'):'沒有'}</li><li>修改前：${st(snap)}（${snap.bpm} BPM，${nm[snap.inst]}，力度${dn[snap.dyn]}）</li><li>修改後：${st(B)}（${B.bpm} BPM，${nm[B.inst]}，力度${dn[B.dyn]}）</li></ul><div class="row"><button onclick="playSong(snap)">▶ 聽修改前</button><button onclick="playSong(S)">▶ 聽修改後</button></div>`};
render();
<\/script></body></html>
</script>

<script>
const LV=[
  {t:"音量魔法師",d:"漸強漸弱大對決",src:"lv1"},
  {t:"旋律密碼寶箱",d:"音高與旋律記憶",src:"lv2"},
  {t:"節拍忍者",d:"四分音符、八分音符與休止符",src:"lv3"},
  {t:"音色偵探社",d:"誰在發出聲音？認識樂器音色",src:"lv4"},
  {t:"音樂快慢列車",d:"聽出速度，認識速度術語",src:"lv5"},
  {t:"AI音樂創作大師",d:"用音符與力度創作自己的樂曲",src:"lv6"}
];
const $=id=>document.getElementById(id);
let prog={};
try{prog=JSON.parse(localStorage.getItem("music-adventure")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("music-adventure",JSON.stringify(prog))}catch(e){}};
const NEED=4;
const open_=i=>!LV[i].soon;
const passed=()=>LV.filter((l,i)=>(prog[i]||0)>0).length;

const ICON=["<svg viewBox=\"0 0 100 100\" aria-hidden=\"true\"><circle cx=\"50\" cy=\"50\" r=\"46\" fill=\"#7c5cf0\"/><path d=\"M50 16 30 62h40z\" fill=\"#2a2140\"/><ellipse cx=\"50\" cy=\"63\" rx=\"26\" ry=\"7\" fill=\"#2a2140\"/><circle cx=\"50\" cy=\"44\" r=\"4\" fill=\"#ffd34d\"/><path d=\"M74 38q8 8 0 16M80 30q14 16 0 32\" fill=\"none\" stroke=\"#fff\" stroke-width=\"4\" stroke-linecap=\"round\"/></svg>", "<svg viewBox=\"0 0 100 100\" aria-hidden=\"true\"><circle cx=\"50\" cy=\"50\" r=\"46\" fill=\"#0f9b78\"/><rect x=\"24\" y=\"50\" width=\"52\" height=\"28\" rx=\"5\" fill=\"#9a5a2b\"/><path d=\"M24 50q0-22 26-22t26 22z\" fill=\"#b8742f\"/><rect x=\"44\" y=\"52\" width=\"12\" height=\"14\" rx=\"3\" fill=\"#ffd34d\"/><circle cx=\"72\" cy=\"26\" r=\"5\" fill=\"#ffd34d\"/><path d=\"M77 26V12\" stroke=\"#ffd34d\" stroke-width=\"3\"/></svg>", "<svg viewBox=\"0 0 100 100\" aria-hidden=\"true\"><circle cx=\"50\" cy=\"50\" r=\"46\" fill=\"#e5484d\"/><circle cx=\"50\" cy=\"52\" r=\"27\" fill=\"#2a2140\"/><rect x=\"28\" y=\"45\" width=\"44\" height=\"15\" rx=\"7\" fill=\"#ffe0c2\"/><rect x=\"24\" y=\"33\" width=\"52\" height=\"8\" fill=\"#fff\"/><path d=\"M74 37l14-7M74 40l14 5\" stroke=\"#fff\" stroke-width=\"4\" stroke-linecap=\"round\"/><circle cx=\"42\" cy=\"52\" r=\"3\" fill=\"#2a2140\"/><circle cx=\"58\" cy=\"52\" r=\"3\" fill=\"#2a2140\"/></svg>", "<svg viewBox=\"0 0 100 100\" aria-hidden=\"true\"><circle cx=\"50\" cy=\"50\" r=\"46\" fill=\"#f2a900\"/><circle cx=\"44\" cy=\"44\" r=\"21\" fill=\"#fff\" fill-opacity=\".85\" stroke=\"#2a2140\" stroke-width=\"7\"/><path d=\"M59 59 80 80\" stroke=\"#2a2140\" stroke-width=\"9\" stroke-linecap=\"round\"/><ellipse cx=\"38\" cy=\"52\" rx=\"5\" ry=\"4\" fill=\"#2a2140\"/><path d=\"M43 52V34l10 4\" fill=\"none\" stroke=\"#2a2140\" stroke-width=\"3\"/></svg>", "<svg viewBox=\"0 0 100 100\" aria-hidden=\"true\"><circle cx=\"50\" cy=\"50\" r=\"46\" fill=\"#2f80ed\"/><rect x=\"20\" y=\"34\" width=\"60\" height=\"32\" rx=\"9\" fill=\"#fff\"/><rect x=\"27\" y=\"40\" width=\"12\" height=\"12\" rx=\"2\" fill=\"#2f80ed\"/><rect x=\"44\" y=\"40\" width=\"12\" height=\"12\" rx=\"2\" fill=\"#2f80ed\"/><rect x=\"61\" y=\"40\" width=\"12\" height=\"12\" rx=\"2\" fill=\"#2f80ed\"/><circle cx=\"34\" cy=\"70\" r=\"6\" fill=\"#2a2140\"/><circle cx=\"66\" cy=\"70\" r=\"6\" fill=\"#2a2140\"/><path d=\"M8 42h8M10 52h8M8 60h8\" stroke=\"#fff\" stroke-width=\"3\" stroke-linecap=\"round\"/></svg>", "<svg viewBox=\"0 0 100 100\" aria-hidden=\"true\"><circle cx=\"50\" cy=\"50\" r=\"46\" fill=\"#ff7a45\"/><path d=\"M22 34h56M22 42h56M22 50h56M22 58h56M22 66h56\" stroke=\"#fff\" stroke-width=\"2\" opacity=\".7\"/><ellipse cx=\"38\" cy=\"58\" rx=\"7\" ry=\"5\" fill=\"#fff\"/><path d=\"M45 58V32\" stroke=\"#fff\" stroke-width=\"3\"/><ellipse cx=\"62\" cy=\"50\" rx=\"7\" ry=\"5\" fill=\"#fff\"/><path d=\"M69 50V26\" stroke=\"#fff\" stroke-width=\"3\"/><path d=\"M80 22l2 6 6 2-6 2-2 6-2-6-6-2 6-2z\" fill=\"#ffd34d\"/></svg>"];
function render(){
  let sum=0;
  $("nodes").innerHTML="";
  LV.forEach((l,i)=>{
    const s=prog[i]||0;sum+=s;
    const b=document.createElement("button");
    const ok=open_(i);
    b.className="node"+(ok?"":" lock")+(s?" done":"");
    b.innerHTML=ICON[i]+'<b>'+l.t+'</b><span class="st">'+(s?"★".repeat(s)+"☆".repeat(3-s):"☆☆☆")+'</span>';
    b.setAttribute("aria-label",l.t+"："+l.d+(s?"，"+s+" 顆星":""));
    if(ok)b.onclick=()=>start(i);else b.setAttribute("aria-disabled","true");
    $("nodes").appendChild(b);
  });
  const p=passed();
  $("total").textContent="已通過 "+Math.min(p,NEED)+" / "+NEED+" 關　星星 "+sum+" / "+LV.length*3;
  $("clear").style.display=p>=NEED?"block":"none";
  $("clear").textContent=p>=NEED?"🎉 恭喜過關！你已經通過 "+NEED+" 關，其他關卡也可以繼續挑戰。":"";
}
function start(i){
  $("toast").style.display="none";
  $("ptitle").textContent="第 "+(i+1)+" 關：「"+LV[i].t+"」";
  $("frame").srcdoc=$(LV[i].src).textContent.replace(/<\\\/script/g,"</script");
  $("map").style.display="none";$("play").style.display="block";scrollTo(0,0);
}
function home(){
  $("frame").srcdoc="";$("play").style.display="none";$("map").style.display="block";render();
}
$("back").onclick=home;$("tback").onclick=home;
addEventListener("message",e=>{
  if(e.source!==$("frame").contentWindow)return;
  const d=e.data;if(!d||!d.lvl||!d.stars)return;
  const i=d.lvl-1;prog[i]=Math.max(prog[i]||0,d.stars);save();
  const p=passed();
  $("tmsg").textContent="通關！獲得 "+"★".repeat(d.stars)+"　已通過 "+Math.min(p,NEED)+" / "+NEED+" 關"+(p>=NEED?"，恭喜過關！":"");
  $("toast").style.display="block";
});
render();
</script>
</body>
</html>
