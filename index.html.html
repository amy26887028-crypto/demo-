<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>音樂冒險島</title>
<style>
:root{--bg:#fff7e6;--ink:#2a2140;--card:#fff;--line:#e6dcc8;--btn:#6a4bd8;--gold:#f2a900;--lock:#a39cb5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17122b;--ink:#f2eefc;--card:#241d42;--line:#3b3267;--btn:#9a80ff;--gold:#ffc933;--lock:#6f6790}}
:root[data-theme="dark"]{--bg:#17122b;--ink:#f2eefc;--card:#241d42;--line:#3b3267;--btn:#9a80ff;--gold:#ffc933;--lock:#6f6790}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
#map{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:2rem;margin:6px 0 2px}
.sub{margin:0 0 14px;opacity:.8}
.total{font-weight:700;margin-bottom:12px}
#nodes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.node{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 10px;border-radius:18px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font:inherit;text-align:center;cursor:pointer;min-width:0}
.node svg{width:100%;max-width:92px;height:auto;aspect-ratio:1}
.node b{font-size:.95rem;line-height:1.3}
.node .st{color:var(--gold);font-size:.95rem;min-height:1.3em;white-space:nowrap}
.node.lock{border-color:var(--line);cursor:default;opacity:.6}
.node.done{border-color:var(--gold)}
#clear{display:none;margin:0 0 14px;padding:12px 14px;border-radius:14px;background:var(--gold);color:#2a2140;font-weight:700;line-height:1.5}
#play{display:none}
#top{display:flex;align-items:center;gap:10px;padding:10px 14px}
#top button{font:inherit;font-weight:700;cursor:pointer;border-radius:12px;border:2px solid var(--ink);padding:8px 14px;background:transparent;color:var(--ink)}
#top span{font-weight:700}
#toast{display:none;margin:0 14px 8px;padding:10px 14px;border-radius:12px;background:var(--gold);color:#2a2140;font-weight:700}
#toast button{margin-left:10px;font:inherit;font-weight:700;border-radius:10px;border:2px solid #2a2140;background:#fff;color:#2a2140;padding:4px 12px;cursor:pointer}
iframe{display:block;width:100%;height:calc(100svh - 70px);border:0}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800;900&display=swap"></head>
<body>
<section id="map">
  <h1>音樂冒險島</h1>
  <p class="sub">四年級音樂闖關，六關任選，通過其中四關就過關！</p>
  <div class="total" id="total"></div>
  <div id="clear" role="status"></div>
  <div id="nodes"></div>
</section>
<section id="play">
  <div id="top"><button id="back">← 回地圖</button><span id="ptitle"></span></div>
  <div id="toast"><span id="tmsg"></span><button id="tback">回地圖</button></div>
  <iframe id="frame" title="關卡" allow="autoplay"></iframe>
</section>

<!-- 每一關是一份完整的 HTML。新增關卡：貼一個新的 script 區塊，再到下面 LV 清單加一筆。 -->
<script type="text/plain" id="lv1"><!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>音量魔法師</title>
<style>
:root{--bg:#f3efff;--ink:#241f3d;--card:#fff;--line:#d9d2f2;--tgt:#8a63f0;--tgtf:rgba(138,99,240,.16);--ok:#17a06d;--warn:#f08a00;--bad:#d9444a;--btn:#5b3fd0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15112a;--ink:#f1eeff;--card:#221c40;--line:#3a3166;--tgt:#b79bff;--tgtf:rgba(183,155,255,.18);--ok:#4cd39b;--warn:#ffb340;--bad:#ff7b80;--btn:#8d74ff}}
:root[data-theme="dark"]{--bg:#15112a;--ink:#f1eeff;--card:#221c40;--line:#3a3166;--tgt:#b79bff;--tgtf:rgba(183,155,255,.18);--ok:#4cd39b;--warn:#ffb340;--bad:#ff7b80;--btn:#8d74ff}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:1.7rem;margin:4px 0}
.sub{margin:0 0 12px;opacity:.8}
.bar{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:8px}
.dots{display:flex;gap:6px}.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--btn)}.dots i.done{background:var(--ok)}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px}
.task{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.sym{font-size:2.2rem;font-weight:800;min-width:64px;text-align:center;color:var(--tgt);}
.task b{font-size:1.2rem}.task span{display:block;opacity:.8;font-size:.95rem}
.stage{display:flex;gap:8px;align-items:stretch}
canvas{flex:1;min-width:0;height:240px;display:block}
.fader{position:relative;width:68px;height:240px;touch-action:none;cursor:ns-resize;border-radius:14px;background:var(--bg);border:2px solid var(--line);user-select:none}
.rail{position:absolute;left:50%;top:14px;bottom:14px;width:10px;margin-left:-5px;border-radius:5px;background:var(--line)}
.fill{position:absolute;left:0;right:0;bottom:0;border-radius:5px;background:var(--tgt)}
.thumb{position:absolute;left:6px;right:6px;height:28px;margin-bottom:-14px;border-radius:10px;background:var(--btn);border:3px solid var(--card);box-shadow:0 0 0 2px var(--btn)}
.msg{text-align:center;font-weight:700;min-height:1.7em;margin:10px 0 0}
button{font:inherit;font-weight:700;cursor:pointer;border-radius:14px;border:2px solid var(--ink);padding:13px 18px;margin:10px 6px 0 0;background:var(--btn);color:#fff}
button.g{background:transparent;color:var(--ink)}
.row{display:flex;flex-wrap:wrap}
.meter{margin:8px 0}.meter div{height:12px;border-radius:6px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%;background:var(--ok)}
.meter p{margin:0 0 3px;display:flex;justify-content:space-between;font-size:.95rem}
.hint{margin:4px 0;line-height:1.6}
.stars{font-size:2rem;text-align:center;color:var(--warn)}
.hide{display:none}
:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800;900&display=swap"></head>
<body>
<main>
<h1>音量魔法師</h1>
<p class="sub">第一關：漸強漸弱大對決</p>
<div class="bar"><span id="rn"></span><span class="dots" id="dots"></span></div>
<div class="card">
  <div class="task"><div class="sym" id="sym"></div><div><b id="tt"></b><span id="td"></span></div></div>
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="fader" id="fd" role="slider" tabindex="0" aria-label="音量控制桿" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
      <div class="rail"><div class="fill" id="fl"></div></div><div class="thumb" id="th"></div>
    </div>
  </div>
  <p class="msg" id="msg">先試試拉桿，聽聽音量變化，再按「開始」。</p>
  <div class="row" id="ctl"><button id="go">開始</button></div>
  <div id="res" class="hide"></div>
</div>
</main>

<script>
const T=6, LV={pp:.1,p:.25,mp:.4,mf:.55,f:.75,ff:.9};
const PAD=14;
const R=[
 {n:"漸強",s:"<",t:"cresc. 漸強：聲音慢慢變大",d:"從 p（弱）慢慢推到 f（強）",pts:[[0,LV.p],[1,LV.f]]},
 {n:"漸弱",s:">",t:"decresc. 漸弱：聲音慢慢變小",d:"從 f（強）慢慢拉回 p（弱）",pts:[[0,LV.f],[1,LV.p]]},
 {n:"強弱記號",s:"mf",t:"mf 中強：保持穩定的音量",d:"把桿子停在 mf 的線上，不要晃動",pts:[[0,LV.mf],[1,LV.mf]]},
 {n:"漸強再漸弱",s:"<>",t:"先漸強，再漸弱",d:"p → ff → p，最高點在中間",pts:[[0,LV.p],[.5,LV.ff],[1,LV.p]]},
 {n:"魔王關",s:"pp→ff→mp",t:"魔王關：兩段變化",d:"pp 漸強到 ff，再漸弱到 mp",pts:[[0,LV.pp],[.5,LV.ff],[1,LV.mp]]}
];
const $=id=>document.getElementById(id);
const cv=$("cv"),cx=cv.getContext("2d");
let ri=0,v=.5,run=false,samples=[],t0=0,ac,osc,gn,best=[0,0,0,0,0],lastScore=0;

function tgt(p){const a=R[ri].pts;for(let i=1;i<a.length;i++){if(p<=a[i][0]){const[x0,y0]=a[i-1],[x1,y1]=a[i];return y0+(y1-y0)*(p-x0)/(x1-x0)}}return a[a.length-1][1]}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

function audio(){
  if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();osc=ac.createOscillator();gn=ac.createGain();osc.type="triangle";osc.frequency.value=330;gn.gain.value=0;osc.connect(gn);gn.connect(ac.destination);osc.start()}
  if(ac.state==="suspended")ac.resume();
}
function setGain(on){if(!gn)return;gn.gain.setTargetAtTime(on?v*v*.5:0,ac.currentTime,.03)}

function size(){const r=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;cv.width=w*r;cv.height=h*r;cx.setTransform(r,0,0,r,0,0);draw()}
const Y=val=>cv.clientHeight-PAD-val*(cv.clientHeight-2*PAD);
const X=p=>34+p*(cv.clientWidth-44);

function draw(prog){
  const w=cv.clientWidth,h=cv.clientHeight;cx.clearRect(0,0,w,h);
  cx.font="12px 'Noto Sans TC',system-ui,sans-serif";cx.textBaseline="middle";
  for(const k in LV){cx.strokeStyle=css("--line");cx.lineWidth=1;cx.setLineDash([3,4]);cx.beginPath();cx.moveTo(30,Y(LV[k]));cx.lineTo(w,Y(LV[k]));cx.stroke();cx.fillStyle=css("--ink");cx.globalAlpha=.7;cx.fillText(k,2,Y(LV[k]));cx.globalAlpha=1}
  cx.setLineDash([]);
  const pts=[];for(let i=0;i<=60;i++)pts.push([i/60,tgt(i/60)]);
  cx.beginPath();cx.moveTo(X(0),Y(0));pts.forEach(([p,y])=>cx.lineTo(X(p),Y(y)));cx.lineTo(X(1),Y(0));cx.closePath();cx.fillStyle=css("--tgtf");cx.fill();
  cx.beginPath();pts.forEach(([p,y],i)=>i?cx.lineTo(X(p),Y(y)):cx.moveTo(X(p),Y(y)));cx.strokeStyle=css("--tgt");cx.lineWidth=4;cx.stroke();
  if(samples.length>1){
    cx.lineWidth=5;cx.lineCap="round";
    for(let i=1;i<samples.length;i++){const a=samples[i-1],b=samples[i];cx.strokeStyle=Math.abs(b.v-tgt(b.p))<.12?css("--ok"):Math.abs(b.v-tgt(b.p))<.22?css("--warn"):css("--bad");cx.beginPath();cx.moveTo(X(a.p),Y(a.v));cx.lineTo(X(b.p),Y(b.v));cx.stroke()}
  }
  if(prog!=null){cx.strokeStyle=css("--ink");cx.lineWidth=2;cx.globalAlpha=.5;cx.beginPath();cx.moveTo(X(prog),PAD/2);cx.lineTo(X(prog),h-PAD/2);cx.stroke();cx.globalAlpha=1}
}

function setV(n){v=Math.max(0,Math.min(1,n));const pct=v*100;$("fl").style.height=pct+"%";$("th").style.bottom=pct+"%";$("fd").setAttribute("aria-valuenow",Math.round(pct));if(run||previewing)setGain(true)}
let previewing=false;
const fd=$("fd");
function fromPtr(e){const r=fd.getBoundingClientRect();setV((r.bottom-PAD-e.clientY)/(r.height-2*PAD))}
fd.addEventListener("pointerdown",e=>{fd.setPointerCapture(e.pointerId);audio();previewing=true;fromPtr(e)});
fd.addEventListener("pointermove",e=>{if(fd.hasPointerCapture(e.pointerId))fromPtr(e)});
const endP=()=>{previewing=false;if(!run)setGain(false)};
fd.addEventListener("pointerup",endP);fd.addEventListener("pointercancel",endP);
fd.addEventListener("keydown",e=>{if(e.key==="ArrowUp"||e.key==="ArrowDown"){e.preventDefault();audio();setV(v+(e.key==="ArrowUp"?.04:-.04));if(!run){previewing=true;clearTimeout(fd._k);fd._k=setTimeout(endP,300)}}});

function load(){
  const r=R[ri];run=false;samples=[];
  $("rn").textContent="第 "+(ri+1)+" / "+R.length+" 回：「"+r.n+"」";
  $("dots").innerHTML=R.map((_,i)=>'<i class="'+(i<ri?"done":i===ri?"on":"")+'"></i>').join("");
  $("sym").textContent=r.s;$("tt").textContent=r.t;$("td").textContent=r.d;
  $("msg").textContent="先試試拉桿，聽聽音量變化，再按「開始」。";
  $("res").classList.add("hide");$("res").innerHTML="";$("ctl").classList.remove("hide");$("go").disabled=false;
  setV(.5);draw();
}

$("go").onclick=()=>{
  audio();$("go").disabled=true;let c=3;
  $("msg").textContent="準備… "+c;
  const iv=setInterval(()=>{c--;if(c>0){$("msg").textContent="準備… "+c}else{clearInterval(iv);begin()}},700);
};
function begin(){
  run=true;samples=[];t0=performance.now();$("msg").textContent="跟著紫色的線，慢慢拉！";setGain(true);
  (function f(now){
    if(!run)return;
    const p=Math.min(1,(now-t0)/(T*1000));
    samples.push({p,v});draw(p);
    if(p>=1){run=false;setGain(false);finish()}else requestAnimationFrame(f);
  })(performance.now());
}

function resample(n){
  const out=[];let j=0;
  for(let i=0;i<n;i++){const p=i/(n-1);while(j<samples.length-1&&samples[j].p<p)j++;out.push(samples[j].v)}
  return out;
}
function evaluate(){
  const N=61,u=resample(N);
  // light smoothing so tiny hand tremor is forgiven
  const s=u.map((_,i)=>{const a=Math.max(0,i-1),b=Math.min(N-1,i+1);return(u[a]+u[i]+u[b])/3});
  const tg=s.map((_,i)=>tgt(i/(N-1)));
  const e=s.map((x,i)=>x-tg[i]);
  const mae=e.reduce((a,b)=>a+Math.abs(b),0)/N;
  let jerk=0;for(let i=2;i<N;i++)jerk+=Math.abs((s[i]-s[i-1])-(s[i-1]-s[i-2]));jerk/=(N-2);
  const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
  const acc=Math.max(0,1-mae/.3), smooth=Math.max(0,1-jerk/.02);
  const total=Math.round(100*(.6*acc+.4*smooth));
  const hints=[];
  if(smooth<.6)hints.push("聲音有點「一跳一跳」。試著用穩穩的速度慢慢推或拉，像在倒一杯水。");
  const bias=avg(e);
  if(bias>.1)hints.push("整體音量偏大聲，可以再輕一點。");
  if(bias<-.1)hints.push("整體音量偏小聲，可以再大膽一點。");
  const st=avg(e.slice(0,8)),en=avg(e.slice(-8));
  if(Math.abs(st)>.15)hints.push("開頭的音量不太對，先確認起始的強弱記號再開始。");
  if(Math.abs(en)>.15)hints.push("結尾還差一點，要記得慢慢走到目標的強弱記號。");
  let early=0,late=0;
  if(R[ri].pts.length>1&&R[ri].pts[0][1]!==R[ri].pts[1][1]){const mid=Math.floor(N/2);if(Math.abs(avg(e.slice(10,25)))>.15)hints.push(avg(e.slice(10,25))>0?"變化太早了，要等一等再變。":"變化太慢了，要快一點跟上。")}
  if(!hints.length)hints.push("又穩又準，音量變化好平順！");
  return{total,acc:Math.round(acc*100),smooth:Math.round(smooth*100),hints:hints.slice(0,2)};
}
function finish(){
  const r=evaluate();lastScore=r.total;best[ri]=Math.max(best[ri],r.total);
  const st=r.total>=85?3:r.total>=70?2:r.total>=55?1:0;
  const pass=st>0,last=ri===R.length-1;
  $("msg").textContent="";
  let h='<div class="stars">'+"★".repeat(st)+"☆".repeat(3-st)+'</div><p class="msg">魔法評審：'+r.total+' 分'+(pass?"　通過！":"　再試一次吧")+'</p>';
  h+='<div class="meter"><p><span>準不準（跟著線走）</span><b>'+r.acc+'</b></p><div><i style="width:'+r.acc+'%"></i></div></div>';
  h+='<div class="meter"><p><span>順不順（變化平順）</span><b>'+r.smooth+'</b></p><div><i style="width:'+r.smooth+'%"></i></div></div>';
  h+=r.hints.map(t=>'<p class="hint">• '+t+'</p>').join("");
  h+='<div class="row"><button class="g" id="rt">再試一次</button>'+(pass?'<button id="nx">'+(last?"看總成績":"下一回")+'</button>':"")+'</div>';
  $("res").innerHTML=h;$("res").classList.remove("hide");$("ctl").classList.add("hide");
  $("rt").onclick=load;
  if(pass)$("nx").onclick=()=>{last?final():(ri++,load())};
}
function final(){
  const avg=Math.round(best.reduce((a,b)=>a+b,0)/R.length);
  const title=avg>=85?"音量大魔法師":avg>=70?"音量小魔法師":"音量魔法學徒";
  $("res").innerHTML='<div class="stars">'+"★".repeat(avg>=85?3:avg>=70?2:1)+'</div><p class="msg">平均 '+avg+' 分，獲得稱號：'+title+'</p><p class="hint" style="text-align:center">你已經學會用漸強、漸弱和強弱記號控制音量了！</p><div class="row"><button id="rs">重新挑戰</button></div>';
  $("rs").onclick=()=>{ri=0;best=[0,0,0,0,0];load()};parent.postMessage({lvl:1,stars:avg>=85?3:avg>=70?2:1},"*");
}
window.addEventListener("resize",size);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>draw());
size();load();
<\/script>
</body>
</html>
</script>
<script type="text/plain" id="lv2"><!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旋律密碼寶箱</title>
<style>
:root{--bg:#e9f6f1;--ink:#17332c;--card:#fff;--line:#cfe5dc;--gold:#e8a200;--btn:#0f7a5c;--ok:#17a06d;--bad:#d9444a;--key:#fdfdf8;--keyon:#ffd34d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#0f1f1b;--ink:#e8f6f1;--card:#18302a;--line:#2b4a41;--gold:#ffc933;--btn:#38c79b;--ok:#4cd39b;--bad:#ff7b80;--key:#26433a;--keyon:#ffc933}

.glow{opacity:0;transition:opacity .4s}.open .glow{opacity:1}

.slot{width:38px;height:38px;border-radius:50%;border:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
.slot.now{border-color:var(--btn)}.slot.ok{background:var(--ok);border-color:var(--ok);color:#fff}.slot.bad{background:var(--bad);border-color:var(--bad);color:#fff}.slot.fill{background:var(--btn);border-color:var(--btn);color:#fff}
.keys{display:flex;gap:4px;margin:10px 0}
.key{flex:1;height:110px;border-radius:0 0 10px 10px;border:2px solid var(--ink);background:var(--key);color:var(--ink);font:inherit;font-weight:700;font-size:.95rem;padding:0 0 8px;display:flex;align-items:flex-end;justify-content:center;cursor:pointer}
.key.on{background:var(--keyon);color:#17332c;transform:translateY(3px)}
button.act{font:inherit;font-weight:700;cursor:pointer;border-radius:14px;border:2px solid var(--ink);padding:12px 18px;margin:6px 4px 0;background:var(--btn);color:#fff}

.msg{font-weight:700;min-height:1.6em;margin:8px 0 0}

.ai b{display:block;margin-bottom:2px}
.lv{display:flex;gap:3px;margin:4px 0}.lv i{flex:1;height:8px;border-radius:4px;background:var(--line)}.lv i.on{background:var(--btn)}
.hide{display:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800;900&display=swap"></head>
<body>
<main>
<h1>旋律密碼寶箱</h1>
<p class="sub">第二關：聽旋律，用琴鍵彈出密碼</p>
<div class="bar"><span id="rn"></span><span class="dots" id="dots"></span></div>
<div class="card">
  <div id="chestBox">
    <svg class="chest" viewBox="0 0 170 130" role="img" aria-label="寶箱">
      <g class="glow"><circle cx="85" cy="60" r="34" fill="var(--gold)" opacity=".35"/><path d="M85 28 L91 50 L113 52 L96 66 L101 88 L85 76 L69 88 L74 66 L57 52 L79 50Z" fill="var(--gold)"/></g>
      <rect x="30" y="62" width="110" height="56" rx="8" fill="#9a5a2b" stroke="#4a2a12" stroke-width="4"/>
      <rect x="30" y="80" width="110" height="8" fill="#4a2a12" opacity=".5"/>
      <g class="lid"><path d="M30 62 Q30 30 85 30 Q140 30 140 62Z" fill="#b8742f" stroke="#4a2a12" stroke-width="4"/></g>
      <rect x="76" y="68" width="18" height="22" rx="4" fill="var(--gold)" stroke="#4a2a12" stroke-width="3"/>
    </svg>
  </div>
  <div class="slots" id="slots"></div>
  <button class="act" id="play">聽密碼</button><button class="act g hide" id="next">下一個寶箱</button>
  <div class="msg" id="msg">按「聽密碼」，仔細聽。</div>
  <div class="keys" id="keys"></div>
  <div class="ai" id="ai"></div>
</div>
<div class="card hide" id="end"></div>
</main>

<script>
const NAMES=["Do","Re","Mi","Fa","Sol","La","Si","高Do"];
const FREQ=[261.63,293.66,329.63,349.23,392,440,493.88,523.25];
const LVT=[[3,1],[3,2],[4,2],[4,3],[5,3],[5,4],[5,5],[5,7]];
const CHESTS=8;
const $=id=>document.getElementById(id);
let ac,A=1,cfg,mel,inp,att,rep,heard,playing,done,r=0,gems=0,res=[],seen={},err={};

function tone(i){
  ac=ac||new(window.AudioContext||window.webkitAudioContext)();
  if(ac.state==="suspended")ac.resume();
  const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
  o.type="triangle";o.frequency.value=FREQ[i];
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.4,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.7);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.75);
}
const level=()=>Math.max(0,Math.min(7,Math.round(A)));
const lab=d=>d===1?"相鄰的音":d===2?"跳過一個音":d===3?"跳過兩個音":"大跳";

function gen(n,mx,focus){
  let best=null;
  for(let k=0;k<40;k++){
    const m=[Math.floor(Math.random()*8)];
    while(m.length<n){
      const p=m[m.length-1],c=[];
      for(let j=0;j<8;j++){const d=Math.abs(j-p);if(d>=1&&d<=mx)c.push(j)}
      m.push(c[Math.floor(Math.random()*c.length)]);
    }
    best=m;
    if(!focus||focus>mx)break;
    if(m.some((x,i)=>i&&Math.abs(x-m[i-1])===focus))break;
  }
  return best;
}
function focusSize(){
  let f=0,w=0;
  for(const s in seen){const rate=(err[s]||0)/seen[s];if(seen[s]>=2&&rate>=.4&&rate>w){w=rate;f=+s}}
  return f;
}
function describe(){const[n,m]=LVT[level()];return n+" 個音，音和音最多相差 "+(m>=7?"一整個八度":m+" 格")}

for(let i=0;i<8;i++){
  const k=document.createElement("button");k.className="key";k.textContent=NAMES[i];k.dataset.i=i;k.onclick=()=>press(i);$("keys").appendChild(k);
}
const keyEl=i=>$("keys").children[i];
function flash(i){keyEl(i).classList.add("on");setTimeout(()=>keyEl(i).classList.remove("on"),220)}

function slots(states){
  $("slots").innerHTML=mel.map((_,i)=>{
    const s=states&&states[i]?states[i]:i<inp.length?"fill":i===inp.length?"now":"";
    return '<div class="slot '+s+'">'+(s==="fill"||s==="ok"||s==="bad"?NAMES[inp[i]]:"")+'</div>';
  }).join("");
}
function panel(extra){
  const L=level();
  $("ai").innerHTML='<b>寶箱管家（AI 難度調整）</b><div class="lv" aria-hidden="true">'+LVT.map((_,i)=>'<i class="'+(i<=L?"on":"")+'"></i>').join("")+'</div>目前難度：'+describe()+'。'+(extra?"<br>"+extra:"");
}
function bar(){
  $("rn").textContent="第 "+(r+1)+" / "+CHESTS+" 個寶箱";
  $("dots").innerHTML=Array.from({length:CHESTS},(_,i)=>'<i class="'+(i<res.length?(res[i]?"win":"lose"):i===r?"on":"")+'"></i>').join("");
}

function newChest(extra){
  cfg=LVT[level()];mel=gen(cfg[0],cfg[1],focusSize());
  inp=[];att=0;rep=0;heard=false;playing=false;done=false;
  $("chestBox").classList.remove("open");$("next").classList.add("hide");$("play").classList.remove("hide");$("play").textContent="聽密碼";
  $("msg").textContent="按「聽密碼」，仔細聽。";
  bar();slots();panel(extra);
}
function playMel(){
  if(playing||done)return;
  playing=true;if(heard)rep++;heard=true;inp=[];slots();
  $("msg").textContent="仔細聽…";$("play").textContent="再聽一次";
  const hint=level()<=3;
  mel.forEach((n,i)=>setTimeout(()=>{tone(n);if(hint)flash(n)},i*700+200));
  setTimeout(()=>{playing=false;$("msg").textContent="換你了！按出 "+mel.length+" 個音。"},mel.length*700+300);
}
$("play").onclick=playMel;

function press(i){
  tone(i);flash(i);
  if(done)return;
  if(!heard){$("msg").textContent="先按「聽密碼」喔！";return}
  if(playing||inp.length>=mel.length)return;
  inp.push(i);slots();
  if(inp.length===mel.length)setTimeout(check,350);
}
function check(){
  att++;
  const st=mel.map((n,i)=>inp[i]===n?"ok":"bad");
  mel.forEach((n,i)=>{if(i>0){const d=Math.abs(n-mel[i-1]);seen[d]=(seen[d]||0)+1;if(st[i]==="bad")err[d]=(err[d]||0)+1}});
  slots(st);
  const wrong=st.filter(s=>s==="bad").length;
  if(!wrong){
    done=true;const g=att===1?(rep<=1?3:2):1;gems+=g;res.push(true);
    $("chestBox").classList.add("open");$("msg").textContent="寶箱打開了！得到 "+g+" 顆寶石";
    adjust(att===1?(rep<=1?1:.5):0);
  }else if(att<2){
    $("msg").textContent="有 "+wrong+" 個音不對（紅色），再聽一次試試。";
    inp=[];heard=true;setTimeout(()=>{if(!done&&!playing)slots()},1600);
  }else{
    done=true;res.push(false);
    $("msg").textContent="這次沒打開。正確密碼是："+mel.map(n=>NAMES[n]).join(" ");
    adjust(-1);
  }
}
function adjust(d){
  const before=level();A=Math.max(0,Math.min(7.49,A+d));const after=level();
  let t;
  if(after>before)t="你答得又穩又準！下一個寶箱升級：";
  else if(after<before)t="這個有點難，下一個寶箱我們調簡單一點：";
  else t="難度先不變，再練習一下：";
  const last=r===CHESTS-1;
  const f=focusSize();
  const nextCfg=LVT[after];
  const txt=last?"":t+nextCfg[0]+" 個音，最大音程 "+(nextCfg[1]>=7?"一整個八度":nextCfg[1]+" 格")+"。"+(f&&f<=nextCfg[1]?" 我發現「"+lab(f)+"」比較容易錯，下一個會多出現。":"");
  panel(txt);bar();
  $("play").classList.add("hide");$("next").textContent=last?"看總成績":"下一個寶箱";$("next").classList.remove("hide");
}
$("next").onclick=()=>{if(r===CHESTS-1)final();else{r++;newChest()}};

function final(){
  $("end").classList.remove("hide");
  const win=res.filter(Boolean).length;
  const title=gems>=20?"旋律尋寶王":gems>=12?"旋律小探險家":"旋律尋寶新手";
  let weak="",f=focusSize();
  if(f)weak="<p>要加強：「"+lab(f)+"」的音程，多聽幾次就會進步。</p>";
  $("end").innerHTML='<h2>尋寶完成！</h2><p>打開了 '+win+' / '+CHESTS+' 個寶箱，獲得 '+gems+' 顆寶石</p><p><b>稱號：'+title+'</b></p><p>最後的挑戰難度：'+describe()+'</p>'+weak+'<button class="act" id="again">再玩一次</button>';
  $("again").onclick=()=>{r=0;gems=0;res=[];A=1;seen={};err={};$("end").classList.add("hide");newChest()};
  $("end").scrollIntoView({behavior:"smooth"});parent.postMessage({lvl:2,stars:gems>=20?3:gems>=12?2:1},"*");
}
newChest();
<\/script>
</body>
</html>
</script>

  padding:max(18px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(18px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

      <p class="hintline">常常顯示「晚了一點」(例如用藍牙設備),就把數字調大;常常顯示「早了一點」就調小。</p>

<script>
(function(){
'use strict';

/*AI-START*/
function makeAI(level,bpm,rng){
  rng=rng||Math.random;
  var NAMES=['見習忍者','下忍','中忍','上忍','影忍','忍頭','師範','宗師'];
  var TYPE={Q:'四分音符',E:'八分音符',R:'休止符'};
  var LV={
    1:{pE:0,pR:0,maxE:0,maxR:0},
    2:{pE:0,pR:.22,maxE:0,maxR:1},
    3:{pE:.28,pR:.16,maxE:1,maxR:1},
    4:{pE:.32,pR:.2,maxE:2,maxR:1},
    5:{pE:.4,pR:.2,maxE:2,maxR:2},
    6:{pE:.45,pR:.22,maxE:3,maxR:2},
    7:{pE:.55,pR:.2,maxE:3,maxR:2},
    8:{pE:.6,pR:.25,maxE:4,maxR:2}
  };
  var st={level:level,bpm:bpm,changeIdx:1,history:[],recent:[],
    intro:{E:level>=3,R:level>=2},weak:null,weakShown:null,last:'',maxLevel:level,maxBpm:bpm};

  function noteResult(type,ok){
    st.recent.push({type:type,ok:ok});
    if(st.recent.length>14) st.recent.shift();
  }
  function report(idx,ok,tot){ st.history.push({idx:idx,ok:ok,tot:tot}); }
  function rolling(){
    var h=st.history.slice(-2),ok=0,tot=0;
    h.forEach(function(x){ok+=x.ok;tot+=x.tot;});
    return tot?ok/tot:null;
  }
  function weakType(){
    var agg={Q:{n:0,ok:0},E:{n:0,ok:0},R:{n:0,ok:0}};
    st.recent.forEach(function(r){agg[r.type].n++; if(r.ok) agg[r.type].ok++;});
    var w=null,wa=0.75;
    ['E','R','Q'].forEach(function(t){
      var a=agg[t];
      if(a.n>=3){var acc=a.ok/a.n; if(acc<wa){wa=acc;w=t;}}
    });
    return w;
  }
  function gen(force){
    var c=LV[st.level],pE=c.pE,pR=c.pR,weak=st.weak;
    if(weak==='E'&&c.pE>0) pE=Math.min(.7,pE*1.7+.08);
    if(weak==='R'&&c.pR>0) pR=Math.min(.4,pR*1.7+.06);
    if(weak==='Q'){pE*=.5;pR*=.5;}
    for(var tries=0;tries<40;tries++){
      var t=[],nE=0,nR=0,i;
      for(i=0;i<4;i++){
        var r=rng(),k='Q';
        if(r<pR) k='R'; else if(r<pR+pE) k='E';
        if(k==='R'&&(nR>=c.maxR||(i===0&&st.level<=3)||(i>0&&t[i-1]==='R'&&st.level<=5))) k='Q';
        if(k==='E'&&nE>=c.maxE) k='Q';
        if(k==='R') nR++;
        if(k==='E') nE++;
        t.push(k);
      }
      if(force&&t.indexOf(force)<0){
        var slots=[];
        for(i=0;i<4;i++){
          if(t[i]!=='Q') continue;
          if(force==='R'&&((i===0&&st.level<=3)||(i>0&&t[i-1]==='R'))) continue;
          slots.push(i);
        }
        if(!slots.length) continue;
        t[slots[Math.floor(rng()*slots.length)]]=force;
      }
      if(st.level>1&&t.join('')===st.last&&tries<39) continue;
      return t;
    }
    return ['Q','Q','Q','Q'];
  }
  function next(idx){
    var msg=null,changed=false;
    st.weak=weakType();
    var ent=st.history.filter(function(x){return x.idx>=st.changeIdx;}).slice(-2);
    if(ent.length){
      var ok=0,tot=0;
      ent.forEach(function(x){ok+=x.ok;tot+=x.tot;});
      var acc=tot?ok/tot:1,pct=Math.round(acc*100);
      if(ent.length>=2&&acc>=.9){
        var cap=Math.min(108,66+st.level*6);
        if(st.bpm+6<=cap){st.bpm+=6;msg='正確率 '+pct+'%!速度加快到 '+st.bpm+' 拍。';changed=true;}
        else if(st.level<8){
          st.level++;st.bpm=Math.max(54,st.bpm-12);changed=true;
          msg='正確率 '+pct+'%,升級到「'+NAMES[st.level-1]+'」!節奏會變得更密。';
        } else msg='正確率 '+pct+'%!你已經是宗師了,繼續保持。';
      } else if((ent.length===1&&acc<.55)||(ent.length>=2&&acc<.65)){
        if(st.bpm>54){st.bpm-=6;msg='正確率 '+pct+'%,先放慢到 '+st.bpm+' 拍,穩穩跟著節拍器。';changed=true;}
        else if(st.level>1){st.level--;msg='先回到「'+NAMES[st.level-1]+'」的練習,把基本功練穩。';changed=true;}
        else if(st.bpm>48){st.bpm-=6;msg='再放慢一點,到 '+st.bpm+' 拍。';changed=true;}
      }
    }
    if(changed) st.changeIdx=idx;
    var force=null;
    if(st.level>=3&&!st.intro.E) force='E';
    else if(st.level>=2&&!st.intro.R) force='R';
    var tokens=gen(force);
    if(force&&tokens.indexOf(force)>=0){
      st.intro[force]=true;
      msg=force==='E'?'新招「八分音符」!一拍裡快速點兩下,口訣 ti-ti。':'新招「休止符」!看到灰色框,這一拍手要停住。';
    }
    if(!msg&&st.weak&&st.weak!==st.weakShown){
      msg='師父發現「'+TYPE[st.weak]+'」還不太穩,接下來多練幾次。';
      st.weakShown=st.weak;
    }
    if(!st.weak) st.weakShown=null;
    st.last=tokens.join('');
    st.maxLevel=Math.max(st.maxLevel,st.level);
    st.maxBpm=Math.max(st.maxBpm,st.bpm);
    return {tokens:tokens,bpm:st.bpm,level:st.level,msg:msg,weak:st.weak};
  }
  return {st:st,noteResult:noteResult,report:report,next:next,rolling:rolling,names:NAMES};
}
/*AI-END*/

var $=function(s){return document.querySelector(s);};
var TOTAL=16;
var FD='"Noto Sans TC",sans-serif',FN='"Noto Sans TC",sans-serif',FB='"Noto Sans TC",sans-serif';
var C={q:'#FF7A9C',e:'#46DCCB',r:'#9AA6D8',gold:'#FFC94D',red:'#F0503E',ink:'#12172E',paper:'#EEF1FF',mute:'#98A3D6',gray:'#5B6389'};
var START={1:{level:1,bpm:60},3:{level:3,bpm:66},5:{level:5,bpm:78}};
var TYPE_NAME={Q:'四分音符',E:'八分音符',R:'休止符'};
var clamp=function(v,a,b){return Math.max(a,Math.min(b,v));};

var S={phase:'menu',ctx:null,master:null,nb:null,measures:[],pending:[],fx:[],summary:[],ai:null,
  score:0,combo:0,maxCombo:0,extras:0,stats:null,t0:0,latency:0,hints:true,startKey:1,
  slashAt:-9,slashDir:1,flashAt:-9,done:false};

var cv=$('#cv'),g=cv.getContext('2d'),stage=$('#stage');
var W=300,H=500,DPR=1,L={};

/* ---------- audio ---------- */
function initAudio(){
  if(S.ctx) return;
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    S.ctx=new AC();
    S.master=S.ctx.createGain();S.master.gain.value=.85;S.master.connect(S.ctx.destination);
  }catch(e){S.ctx=null;}
}
function clock(){return S.ctx?S.ctx.currentTime:performance.now()/1000;}
function tone(time,freq,dur,type,vol){
  if(!S.ctx) return;
  var o=S.ctx.createOscillator(),gn=S.ctx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,time);
  gn.gain.setValueAtTime(0.0001,time);
  gn.gain.exponentialRampToValueAtTime(vol,time+.005);
  gn.gain.exponentialRampToValueAtTime(0.0001,time+dur);
  o.connect(gn);gn.connect(S.master);o.start(time);o.stop(time+dur+.02);
}
function noiseBuf(){
  if(S.nb) return S.nb;
  var n=Math.floor(S.ctx.sampleRate*.2),b=S.ctx.createBuffer(1,n,S.ctx.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  S.nb=b;return b;
}
function swoosh(){
  if(!S.ctx) return;
  var t=S.ctx.currentTime,src=S.ctx.createBufferSource(),f=S.ctx.createBiquadFilter(),gn=S.ctx.createGain();
  src.buffer=noiseBuf();f.type='bandpass';
  f.frequency.setValueAtTime(1800,t);f.frequency.exponentialRampToValueAtTime(5200,t+.12);
  gn.gain.setValueAtTime(.2,t);gn.gain.exponentialRampToValueAtTime(.001,t+.14);
  src.connect(f);f.connect(gn);gn.connect(S.master);src.start(t);src.stop(t+.16);
}
function tick(time,accent){tone(time,accent?1500:1000,.05,'square',accent?.1:.055);}
function hitSound(type,perfect){
  if(!S.ctx) return;
  var t=S.ctx.currentTime;
  tone(t,type==='E'?880:620,.13,'triangle',.26);
  if(perfect) tone(t,type==='E'?1760:1240,.09,'sine',.09);
}
function buzz(){if(S.ctx) tone(S.ctx.currentTime,140,.2,'sawtooth',.1);}

/* ---------- timing windows (seconds) ---------- */
function goodWin(m){return clamp(.24*60/m.bpm,.14,.26);}
function perfWin(m){return clamp(.12*60/m.bpm,.07,.11);}
function restWin(m){return clamp(.3*60/m.bpm,.15,.3);}

/* ---------- timeline ---------- */
function addMeasure(isCount){
  var prev=S.measures[S.measures.length-1],idx=S.measures.length,startTime,startBeat;
  if(!prev){startTime=S.t0;startBeat=0;}
  else{startTime=prev.startTime+240/prev.bpm;startBeat=prev.startBeat+4;}
  var m={idx:idx,startTime:startTime,startBeat:startBeat,events:[],extras:0,clicked:[false,false,false,false],
    isCount:!!isCount,left:0,ok:0,tot:0,bpm:0,level:1,tokens:null};
  if(isCount){m.bpm=S.ai.st.bpm;m.level=S.ai.st.level;}
  else{
    var r=S.ai.next(idx);
    m.bpm=r.bpm;m.level=r.level;m.tokens=r.tokens;
    if(r.msg) setCoach(r.msg);
    buildEvents(m);
  }
  S.measures.push(m);
}
function buildEvents(m){
  var bs=60/m.bpm;
  function mk(type,i,sub){
    var ev={m:m,type:type,beat:m.startBeat+i+sub,time:m.startTime+(i+sub)*bs,status:'pending',sub:sub,partner:null,dt:0};
    m.events.push(ev);S.pending.push(ev);m.left++;return ev;
  }
  m.tokens.forEach(function(k,i){
    if(k==='E'){var a=mk('E',i,0),b=mk('E',i,.5);a.partner=b;b.partner=a;}
    else mk(k,i,0);
  });
}
function ensureMeasures(now){
  while(S.measures.length<TOTAL+1){
    var last=S.measures[S.measures.length-1],lastEnd=last.startTime+240/last.bpm;
    if(lastEnd-now<4.2*60/last.bpm) addMeasure(false); else break;
  }
}
function scheduleClicks(now){
  if(!S.ctx) return;
  S.measures.forEach(function(m){
    if(m.startTime>now+.4||m.startTime+240/m.bpm<now-.2) return;
    for(var i=0;i<4;i++){
      if(m.clicked[i]) continue;
      var t=m.startTime+i*60/m.bpm;
      if(t<=now+.12){m.clicked[i]=true; if(t>=now-.05) tick(Math.max(t,now),i===0);}
    }
  });
}
function curBeat(now){
  var ms=S.measures;if(!ms.length) return 0;
  var m=ms[0];
  for(var i=ms.length-1;i>=0;i--){if(now>=ms[i].startTime){m=ms[i];break;}}
  return m.startBeat+(now-m.startTime)*m.bpm/60;
}
function measureAt(t){
  for(var i=S.measures.length-1;i>=0;i--){
    var m=S.measures[i];
    if(t>=m.startTime&&t<m.startTime+240/m.bpm) return m;
  }
  return null;
}

/* ---------- judging ---------- */
function addText(text,color,size){S.fx.push({k:'text',t:clock(),x:L.cx,y:L.hitY-48,text:text,color:color,size:size||20,life:.75});}
function resolve(ev,status,dt){
  var ok=status==='perfect'||status==='good'||status==='rest-ok';
  ev.status=status;ev.dt=dt;
  var ix=S.pending.indexOf(ev);if(ix>=0) S.pending.splice(ix,1);
  var m=ev.m;m.left--;m.tot++;if(ok) m.ok++;
  S.stats[ev.type].n++;if(ok) S.stats[ev.type].ok++;
  S.ai.noteResult(ev.type,ok);
  if(ok){
    S.combo++;S.maxCombo=Math.max(S.maxCombo,S.combo);
    var base=status==='perfect'?100:status==='good'?60:40;
    S.score+=Math.round(base*(1+Math.min(Math.floor(S.combo/5),4)*.25));
  }else S.combo=0;
  if(m.left===0){
    var tot=m.tot+m.extras;
    S.ai.report(m.idx,m.ok,tot);
    S.summary.push({idx:m.idx,bpm:m.bpm,level:m.level,ok:m.ok,tot:tot});
  }
}
function onTap(){
  if(S.phase!=='play') return;
  var now=clock(),t=now-S.latency/1000;
  S.slashAt=now;S.slashDir*=-1;
  swoosh();
  var first=S.measures[1];
  if(!first||t<first.startTime-.3) return;
  var best=null,bd=1e9;
  for(var i=0;i<S.pending.length;i++){
    var ev=S.pending[i],w=ev.type==='R'?restWin(ev.m):goodWin(ev.m),d=Math.abs(t-ev.time);
    if(d<=w&&d<bd){best=ev;bd=d;}
  }
  if(!best){
    S.combo=0;S.extras++;
    var mm=measureAt(t);if(mm&&!mm.isCount&&mm.left>0) mm.extras++;
    addText('多點了',C.mute,17);
    return;
  }
  var dt=t-best.time;
  if(best.type==='R'){
    resolve(best,'rest-broken',dt);addText('休止符要停住!',C.red,19);buzz();
  }else{
    var pf=bd<=perfWin(best.m);
    resolve(best,pf?'perfect':'good',dt);
    S.flashAt=now;
    S.fx.push({k:'split',t:now,type:best.type,x:L.cx,y:L.hitY,life:.5});
    hitSound(best.type,pf);
    if(pf) addText('完美!',C.gold,24);
    else addText(dt<0?'早了一點':'晚了一點',C.paper,18);
  }
}
function update(now){
  var tn=now-S.latency/1000;
  for(var i=S.pending.length-1;i>=0;i--){
    var ev=S.pending[i];
    if(ev.type==='R'){
      if(tn>ev.time+restWin(ev.m)){resolve(ev,'rest-ok',0);S.fx.push({k:'text',t:now,x:L.cx,y:L.hitY-48,text:'休息 OK',color:C.teal,size:15,life:.6});}
    }else if(tn>ev.time+goodWin(ev.m)){
      resolve(ev,'miss',0);addText('漏掉',C.mute,17);
    }
  }
}
function checkEnd(now){
  if(S.measures.length<TOTAL+1||S.pending.length) return;
  var last=S.measures[S.measures.length-1];
  if(now>last.startTime+240/last.bpm+.35) finishGame();
}

/* ---------- coach / HUD ---------- */
function setCoach(msg){S.coachMsg=msg;}
var cache={};
function setText(id,v){
  if(cache[id]===v) return;
  cache[id]=v;$(id).textContent=v;
}
function hud(now){
  setText('#hScore',String(S.score));
  setText('#hCombo',String(S.combo));
  var m=null;
  for(var i=S.measures.length-1;i>=0;i--){if(now>=S.measures[i].startTime){m=S.measures[i];break;}}
  var bpm=m?m.bpm:S.ai.st.bpm,lv=m?m.level:S.ai.st.level;
  setText('#hBpm',String(bpm));
  setText('#hLv','Lv'+lv+' '+S.ai.names[lv-1]);
  setText('#coachMsg',S.coachMsg||'');
  var r=S.ai.rolling();
  setText('#hAcc',r===null?'--':Math.round(r*100)+'%');
  var idx=m?m.idx:0;
  $('#prog').style.width=clamp(idx/TOTAL*100,0,100)+'%';
}

/* ---------- glyphs ---------- */
function glyphQuarter(c,x,y,s,col){
  c.save();c.fillStyle=col;c.strokeStyle=col;c.lineWidth=Math.max(1.5,s*.12);c.lineCap='round';
  c.beginPath();c.ellipse(x-s*.18,y+s*.42,s*.34,s*.24,-.4,0,Math.PI*2);c.fill();
  c.beginPath();c.moveTo(x+s*.14,y+s*.36);c.lineTo(x+s*.14,y-s*.78);c.stroke();
  c.restore();
}
function glyphEighth(c,x,y,s,col){
  glyphQuarter(c,x,y,s,col);
  c.save();c.strokeStyle=col;c.lineWidth=Math.max(1.5,s*.12);c.lineCap='round';
  c.beginPath();c.moveTo(x+s*.14,y-s*.78);c.bezierCurveTo(x+s*.2,y-s*.4,x+s*.62,y-s*.42,x+s*.5,y);c.stroke();
  c.restore();
}
function glyphBeamed(c,x,y,s,col){
  c.save();c.fillStyle=col;c.strokeStyle=col;c.lineWidth=Math.max(1.5,s*.12);c.lineCap='round';
  [x-s*.5,x+s*.5].forEach(function(h){
    c.beginPath();c.ellipse(h-s*.18,y+s*.42,s*.34,s*.24,-.4,0,Math.PI*2);c.fill();
    c.beginPath();c.moveTo(h+s*.14,y+s*.36);c.lineTo(h+s*.14,y-s*.78);c.stroke();
  });
  c.lineWidth=s*.26;c.lineCap='butt';
  c.beginPath();c.moveTo(x-s*.5+s*.14,y-s*.7);c.lineTo(x+s*.5+s*.14,y-s*.7);c.stroke();
  c.restore();
}
function glyphRest(c,x,y,s,col){
  c.save();c.strokeStyle=col;c.lineWidth=Math.max(1.8,s*.2);c.lineCap='round';c.lineJoin='round';
  c.beginPath();c.moveTo(x-s*.18,y-s*.85);c.lineTo(x+s*.22,y-s*.4);c.lineTo(x-s*.2,y+s*.05);c.lineTo(x+s*.2,y+s*.5);
  c.quadraticCurveTo(x-s*.35,y+s*.42,x-s*.12,y+s*.9);c.stroke();
  c.restore();
}
function rrect(c,x,y,w,h,r){
  c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);
  c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();
}

/* ---------- drawing ---------- */
function layout(){
  var laneW=Math.min(W*.8,300),hitY=Math.round(H*.72);
  L={laneW:laneW,x0:(W-laneW)/2,cx:W/2,hitY:hitY,ppb:hitY/4};
}
function drawTarget(type,x,y,o){
  o=o||{};
  g.save();g.globalAlpha=o.a===undefined?1:o.a;
  if(type==='Q'){
    g.shadowColor=o.gray?'transparent':C.q;g.shadowBlur=12;
    g.fillStyle=o.gray?C.gray:C.q;g.beginPath();g.arc(x,y,22,0,Math.PI*2);g.fill();
    g.shadowBlur=0;glyphQuarter(g,x,y-1,19,C.ink);
  }else if(type==='E'){
    g.shadowColor=o.gray?'transparent':C.e;g.shadowBlur=10;
    g.fillStyle=o.gray?C.gray:C.e;g.beginPath();g.arc(x,y,16,0,Math.PI*2);g.fill();
    g.shadowBlur=0;glyphEighth(g,x-1,y-1,14,C.ink);
  }else{
    g.fillStyle=o.red?'rgba(240,80,62,.25)':'rgba(154,166,216,.16)';
    rrect(g,x-22,y-22,44,44,10);g.fill();
    g.setLineDash([5,4]);g.lineWidth=2;g.strokeStyle=o.red?C.red:C.r;rrect(g,x-22,y-22,44,44,10);g.stroke();
    g.setLineDash([]);glyphRest(g,x,y,15,o.red?C.red:C.r);
  }
  g.restore();
}
function drawNinja(now){
  var scale=clamp((H-L.hitY)/150,.55,1),nx=L.cx,ny=L.hitY+(H-L.hitY)*.5+4;
  var age=now-S.slashAt,swing=age<.14?age/.14:1,sway=Math.sin(now*3)*1.5;
  g.save();g.translate(nx,ny);g.scale(scale,scale);
  g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(0,34,26,6,0,0,Math.PI*2);g.fill();
  var tail=Math.sin(now*5)*4;
  g.fillStyle=C.red;
  g.beginPath();g.moveTo(-14,-22);g.lineTo(-34,-20+tail);g.lineTo(-30,-14+tail);g.lineTo(-14,-16);g.closePath();g.fill();
  g.fillStyle='#0B0F22';g.strokeStyle='rgba(255,255,255,.22)';g.lineWidth=1.5;
  g.beginPath();g.ellipse(0,18,19,20,0,0,Math.PI*2);g.fill();g.stroke();
  g.beginPath();g.arc(0,-6+sway*.3,17,0,Math.PI*2);g.fill();g.stroke();
  g.fillStyle='#F2D3B8';rrect(g,-12,-13+sway*.3,24,9,4);g.fill();
  g.fillStyle='#0B0F22';
  g.beginPath();g.ellipse(-5,-8.5+sway*.3,2.2,2.6,0,0,Math.PI*2);g.fill();
  g.beginPath();g.ellipse(5,-8.5+sway*.3,2.2,2.6,0,0,Math.PI*2);g.fill();
  g.fillStyle=C.red;rrect(g,-17,-22+sway*.3,34,6,3);g.fill();
  var a=age<.14?(-1.5+swing*2.6)*S.slashDir:-.55,hx=16,hy=12,len=42;
  var ex=hx+Math.sin(a)*len,ey=hy-Math.cos(a)*len;
  g.lineCap='round';g.strokeStyle='#DCE6FF';g.lineWidth=4;g.beginPath();g.moveTo(hx,hy);g.lineTo(ex,ey);g.stroke();
  g.strokeStyle=C.gold;g.lineWidth=5;g.beginPath();g.moveTo(hx-Math.cos(a)*5,hy-Math.sin(a)*5);g.lineTo(hx+Math.cos(a)*5,hy+Math.sin(a)*5);g.stroke();
  g.restore();
}
function draw(now){
  g.setTransform(DPR,0,0,DPR,0,0);
  var bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#10152C');bg.addColorStop(1,'#1A2146');
  g.fillStyle=bg;g.fillRect(0,0,W,H);
  var cb=curBeat(now),i,j;
  [.05,.12,.88,.95].forEach(function(f,k){
    var x=W*f;g.fillStyle='rgba(70,220,203,.06)';g.fillRect(x-5,0,10,H);
    g.fillStyle='rgba(70,220,203,.12)';
    for(var y=-90+((cb*L.ppb*.35+k*37)%90);y<H;y+=90) g.fillRect(x-7,y,14,4);
  });
  g.fillStyle='rgba(255,255,255,.04)';g.fillRect(L.x0,0,L.laneW,H);
  g.strokeStyle='rgba(255,255,255,.08)';g.lineWidth=1;
  g.beginPath();g.moveTo(L.x0,0);g.lineTo(L.x0,H);g.moveTo(L.x0+L.laneW,0);g.lineTo(L.x0+L.laneW,H);g.stroke();

  var vis=S.measures.filter(function(m){return !(m.startBeat+4<cb-1.5||m.startBeat>cb+4.5);});
  vis.forEach(function(m){
    for(var i=0;i<4;i++){
      var y=L.hitY-(m.startBeat+i-cb)*L.ppb;
      if(y<-10||y>H+10) continue;
      g.strokeStyle=i===0?'rgba(255,255,255,.28)':'rgba(255,255,255,.10)';g.lineWidth=i===0?2:1;
      g.beginPath();g.moveTo(L.x0,y);g.lineTo(L.x0+L.laneW,y);g.stroke();
      if(!m.isCount){
        g.textAlign='center';g.textBaseline='middle';
        g.fillStyle=i===0?C.paper:C.mute;g.font='700 14px '+FN;g.fillText(String(i+1),L.x0+15,y-11);
        if(S.hints){
          var yh=y-L.ppb*.5;
          if(yh>-10&&yh<H+10){g.fillStyle='rgba(152,163,214,.45)';g.font='500 12px '+FN;g.fillText('&',L.x0+15,yh);}
        }
      }
    }
  });

  var gl=g.createLinearGradient(0,L.hitY-34,0,L.hitY+34);
  var fa=now-S.flashAt<.16?(1-(now-S.flashAt)/.16)*.35:0;
  gl.addColorStop(0,'rgba(255,201,77,0)');gl.addColorStop(.5,'rgba(255,201,77,'+(.16+fa)+')');gl.addColorStop(1,'rgba(255,201,77,0)');
  g.fillStyle=gl;g.fillRect(L.x0,L.hitY-34,L.laneW,68);
  g.strokeStyle=C.gold;g.lineWidth=3;g.beginPath();g.moveTo(L.x0,L.hitY);g.lineTo(L.x0+L.laneW,L.hitY);g.stroke();
  g.strokeStyle='rgba(255,201,77,.8)';g.lineWidth=2;g.beginPath();g.arc(L.cx,L.hitY,27,0,Math.PI*2);g.stroke();

  vis.forEach(function(m){
    m.events.forEach(function(ev){
      var y=L.hitY-(ev.beat-cb)*L.ppb;
      if(y<-40||y>H+40) return;
      var st=ev.status;
      if(st==='perfect'||st==='good') return;
      if(ev.type==='E'&&ev.sub===0&&ev.partner){
        var p=ev.partner,both=(st==='pending'||st==='miss')&&(p.status==='pending'||p.status==='miss');
        if(both){
          var y2=L.hitY-(p.beat-cb)*L.ppb,gray=st==='miss'&&p.status==='miss';
          g.fillStyle=gray?'rgba(91,99,137,.35)':'rgba(70,220,203,.22)';
          rrect(g,L.cx-21,y2-21,42,y-y2+42,21);g.fill();
        }
      }
      if(ev.type==='R'){
        if(st==='rest-ok') drawTarget('R',L.cx,y,{a:.35});
        else if(st==='rest-broken') drawTarget('R',L.cx,y,{red:true,a:.8});
        else drawTarget('R',L.cx,y);
      }else if(st==='miss'){
        drawTarget(ev.type,L.cx,y,{gray:true,a:.5});
      }else drawTarget(ev.type,L.cx,y);
      if(S.hints&&ev.sub===0&&(st==='pending'||st==='miss')){
        var ly=ev.type==='E'?y-L.ppb*.25:y;
        g.textAlign='left';g.textBaseline='middle';g.font='700 13px '+FB;
        g.fillStyle=ev.type==='Q'?C.q:ev.type==='E'?C.e:C.r;
        g.globalAlpha=st==='miss'?.4:.9;
        g.fillText(ev.type==='Q'?'ta':ev.type==='E'?'ti-ti':'(休)',L.cx+(ev.type==='E'?30:34),ly);
        g.globalAlpha=1;
      }
    });
  });

  var m0=S.measures[0];
  if(m0&&S.phase==='play'&&cb<4){
    g.textAlign='center';g.textBaseline='middle';g.fillStyle=C.gold;
    g.font='900 '+(cb<0?40:76)+'px '+FD;
    g.fillText(cb<0?'準備':String(Math.floor(cb)+1),L.cx,H*.3);
    g.font='500 14px '+FB;g.fillStyle=C.mute;g.fillText('聽節拍器,在心裡跟著數',L.cx,H*.3+(cb<0?36:56));
  }

  S.fx=S.fx.filter(function(f){return now-f.t<f.life;});
  S.fx.forEach(function(f){
    var age=now-f.t,p=age/f.life;
    if(f.k==='text'){
      g.save();g.globalAlpha=1-p*p;g.textAlign='center';g.textBaseline='middle';
      g.font='900 '+f.size+'px '+FD;g.lineWidth=4;g.strokeStyle='rgba(10,13,30,.8)';
      g.strokeText(f.text,f.x,f.y-age*38);g.fillStyle=f.color;g.fillText(f.text,f.x,f.y-age*38);g.restore();
    }else if(f.k==='split'){
      [-1,1].forEach(function(sg){
        g.save();g.translate(f.x+sg*p*46,f.y+p*p*70);g.rotate(sg*p*.9);g.translate(-f.x,-f.y);
        g.beginPath();g.rect(sg<0?f.x-60:f.x,f.y-60,60,120);g.clip();
        drawTarget(f.type,f.x,f.y,{a:1-p});g.restore();
      });
    }
  });
  var sa=now-S.slashAt;
  if(sa<.16&&sa>=0){
    var d=S.slashDir;
    g.save();g.globalAlpha=1-sa/.16;g.lineCap='round';
    g.strokeStyle='#fff';g.shadowColor=C.gold;g.shadowBlur=14;g.lineWidth=4;
    g.beginPath();g.moveTo(L.cx-d*70,L.hitY-34);g.lineTo(L.cx+d*70,L.hitY+34);g.stroke();g.restore();
  }
  drawNinja(now);
}

/* ---------- flow ---------- */
function freshStats(){return {Q:{n:0,ok:0},E:{n:0,ok:0},R:{n:0,ok:0}};}
function show(id){$(id).hidden=false;}
function hide(id){$(id).hidden=true;}
function startGame(){
  initAudio();
  if(S.ctx&&S.ctx.state==='suspended') S.ctx.resume();
  var cfg=START[S.startKey];
  S.ai=makeAI(cfg.level,cfg.bpm);
  S.measures=[];S.pending=[];S.fx=[];S.summary=[];
  S.score=0;S.combo=0;S.maxCombo=0;S.extras=0;S.stats=freshStats();S.done=false;
  S.t0=clock()+.9;
  addMeasure(true);
  S.phase='play';
  setCoach(cfg.level===1?'聽節拍器的聲音。四分音符一拍點一下,準備!':'三種音符都會出現,專心跟著節拍!');
  hide('#menu');hide('#result');hide('#pauseOv');
}
function pauseGame(){
  if(S.phase!=='play') return;
  S.phase='paused';
  if(S.ctx) S.ctx.suspend();
  show('#pauseOv');
}
function resumeGame(){
  if(S.phase!=='paused') return;
  hide('#pauseOv');
  if(S.ctx) S.ctx.resume();
  S.phase='play';
}
function toMenu(){
  S.phase='menu';
  if(S.ctx&&S.ctx.state==='suspended') S.ctx.resume();
  S.measures=[];S.pending=[];S.fx=[];
  hide('#pauseOv');hide('#result');show('#menu');
  S.ai=makeAI(START[S.startKey].level,START[S.startKey].bpm);
  setCoach('按「開始修練」,跟著節拍器出發。');
  renderBest();
}
function loadBest(){try{return JSON.parse(localStorage.getItem('beat-ninja-best')||'null');}catch(e){return null;}}
function saveBest(b){try{localStorage.setItem('beat-ninja-best',JSON.stringify(b));}catch(e){}}
function renderBest(){
  var b=loadBest(),el=$('#bestLine');
  if(b){el.hidden=false;el.textContent='你的最佳:正確率 '+b.acc+'% · 最高到「'+b.rank+'」· '+b.score+' 分';}
  else el.hidden=true;
}
function starSvg(on){
  return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z" fill="'+(on?C.gold:'rgba(255,255,255,.12)')+'"/></svg>';
}
function finishGame(){
  if(S.done) return;
  S.done=true;S.phase='done';
  var st=S.stats,n=0,ok=0,k;
  for(k in st){n+=st[k].n;ok+=st[k].ok;}
  var acc=n?ok/(n+S.extras):0,pct=Math.round(acc*100);
  var stars=acc>=.9?3:acc>=.75?2:acc>=.5?1:0;
  var head=['慢慢來,先把四分音符練穩。','有進步,再練一回合!','很穩,再快一點就更厲害!','忍者大師級的節奏感!'][stars];
  var maxLv=S.ai.st.maxLevel,rank=S.ai.names[maxLv-1];
  var accs={};
  ['Q','E','R'].forEach(function(t){accs[t]=st[t].n?st[t].ok/st[t].n:null;});
  var tips={E:'八分音符:心裡數「1 & 2 &」,一拍裡點兩下。',R:'休止符:手停住,心裡繼續數拍子。',Q:'四分音符:跟著節拍器的「嗒」聲點。'};
  var parts=[];
  if(S.extras>=5) parts.push('有幾次點太多下,看準金線再點。');
  var cand=['E','R','Q'].filter(function(t){return accs[t]!==null;}).sort(function(a,b){return accs[a]-accs[b];})[0];
  if(cand&&accs[cand]<.8) parts.push(tips[cand]);
  if(!parts.length) parts.push('節奏很穩!下次可以挑戰更高的起始等級。');
  var bars='';
  ['Q','E','R'].forEach(function(t){
    if(accs[t]===null) return;
    var p=Math.round(accs[t]*100),col=t==='Q'?C.q:t==='E'?C.e:C.r;
    bars+='<div class="brow"><span>'+TYPE_NAME[t]+'</span><div class="track"><div class="fill" style="width:'+p+'%;background:'+col+'"></div></div><span>'+p+'%</span></div>';
  });
  var traj='';
  S.summary.slice().sort(function(a,b){return a.idx-b.idx;}).forEach(function(x){
    var a=x.tot?x.ok/x.tot:0,col=a>=.9?C.teal:a>=.7?C.gold:C.red;
    traj+='<div><i style="height:'+Math.max(8,Math.round(a*100))+'%;background:'+col+'"></i><em>'+x.bpm+'</em></div>';
  });
  $('#resultBody').innerHTML=
    '<div class="res-h"><div class="stars">'+starSvg(stars>=1)+starSvg(stars>=2)+starSvg(stars>=3)+'</div>'+
    '<h2>'+head+'</h2><p>修練完成,16 小節</p></div>'+
    '<div class="grid4"><div class="kv"><small>正確率</small><b>'+pct+'%</b></div>'+
    '<div class="kv"><small>分數</small><b>'+S.score+'</b></div>'+
    '<div class="kv"><small>最高連擊</small><b>'+S.maxCombo+'</b></div>'+
    '<div class="kv"><small>最高等級</small><b class="t">'+rank+'</b></div></div>'+
    '<div class="bars">'+bars+'</div>'+
    '<div><div class="traj">'+traj+'</div><p class="cap">每一條是一個小節的正確率,下方數字是當時的速度(每分鐘拍數)。最快到 '+S.ai.st.maxBpm+' 拍。</p></div>'+
    '<div class="note"><div class="seal" aria-hidden="true">師</div><p>'+parts.join(' ')+'</p></div>'+
    '<button class="go" id="btnAgain" type="button">再練一回合</button>'+
    '<button class="go alt" id="btnHome" type="button">回首頁</button>';
  $('#btnAgain').onclick=startGame;
  $('#btnHome').onclick=toMenu;
  var best=loadBest();
  if(!best||pct>best.acc||(pct===best.acc&&S.score>best.score)) saveBest({acc:pct,rank:rank,score:S.score});
  show('#result');
  try{parent.postMessage({lvl:3,stars:stars},"*")}catch(e){}
}

/* ---------- setup ---------- */
function resize(){
  W=stage.clientWidth;H=stage.clientHeight;DPR=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);layout();
}
function drawCards(){
  var d=Math.min(window.devicePixelRatio||1,2);
  document.querySelectorAll('.card canvas').forEach(function(c){
    var w=84,h=62;c.width=w*d;c.height=h*d;
    var x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);
    var k=c.getAttribute('data-k');
    if(k==='Q') glyphQuarter(x,w/2,h/2,34,C.q);
    else if(k==='E') glyphBeamed(x,w/2,h/2,26,C.e);
    else glyphRest(x,w/2,h/2,26,C.r);
  });
}
function tapEvt(e){e.preventDefault();$('#tap').classList.add('down');onTap();}
function bind(){
  stage.addEventListener('pointerdown',tapEvt);
  $('#tap').addEventListener('pointerdown',tapEvt);
  var up=function(){$('#tap').classList.remove('down');};
  window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
  window.addEventListener('keydown',function(e){
    if(e.repeat) return;
    if(e.code==='Space'||e.code==='KeyF'||e.code==='KeyJ'||e.code==='KeyD'||e.code==='KeyK'){
      if(S.phase==='play'){e.preventDefault();$('#tap').classList.add('down');onTap();}
    }else if(e.code==='Escape'||e.code==='KeyP'){
      if(S.phase==='play') pauseGame(); else if(S.phase==='paused') resumeGame();
    }
  });
  window.addEventListener('keyup',function(e){
    if(e.code==='Space') e.preventDefault();
    $('#tap').classList.remove('down');
  });
  document.addEventListener('visibilitychange',function(){if(document.hidden) pauseGame();});
  $('#btnPause').addEventListener('click',pauseGame);
  $('#btnResume').addEventListener('click',resumeGame);
  $('#btnQuit').addEventListener('click',toMenu);
  $('#btnStart').addEventListener('click',startGame);
  $('#segStart').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b) return;
    S.startKey=+b.getAttribute('data-k');
    this.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false');});
    S.ai=makeAI(START[S.startKey].level,START[S.startKey].bpm);
  });
  $('#optHints').addEventListener('change',function(){S.hints=this.checked;});
  $('#optLat').addEventListener('input',function(){
    S.latency=+this.value;$('#optLatOut').textContent=(S.latency>0?'+':'')+S.latency+' 毫秒';
  });
}
function frame(){
  requestAnimationFrame(frame);
  var now=clock();
  if(S.phase==='play'){ensureMeasures(now);scheduleClicks(now);update(now);checkEnd(now);hud(now);}
  draw(now);
}

S.stats=freshStats();
S.ai=makeAI(START[1].level,START[1].bpm);
new ResizeObserver(resize).observe(stage);
resize();drawCards();bind();renderBest();
setText('#hBpm',String(START[1].bpm));setText('#hLv','Lv1 '+S.ai.names[0]);
requestAnimationFrame(frame);
})();
<\/script>

<script type="text/plain" id="lv4"><!DOCTYPE html>
